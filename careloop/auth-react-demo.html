<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CareLoop / MindCare — React Onboarding & Auth Demo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18, ReactDOM 18, Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="shared/sound.js"></script>
  <script src="shared/api.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Hidden scrollbars for clean phone chassis */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#0B0D0C] text-[#F4F6F4] min-h-screen overflow-x-hidden">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ====================================================================
    // AUTH PAGE COMPONENT (Inline Babel version of AuthPage.jsx)
    // ====================================================================
    function AuthPage({
      isOpen = true,
      onClose = null,
      onAuthComplete = null,
      isModal = true
    }) {
      const [step, setStep] = useState(1);
      const [selectedDemo, setSelectedDemo] = useState('caregiver'); // 'caregiver' | 'patient'
      const [fullName, setFullName] = useState('Rahul');
      const [age, setAge] = useState('45');
      const [role, setRole] = useState('caregiver');

      // Handle demo selection in Step 1
      const handleSelectDemo = (demoType) => {
        setSelectedDemo(demoType);
        if (demoType === 'caregiver') {
          setFullName('Rahul');
          setAge('45');
          setRole('caregiver');
        } else {
          setFullName('Kamala');
          setAge('74');
          setRole('patient');
        }
      };

      // STEP 2: Auto-verify OTP after exactly 1.5 seconds
      useEffect(() => {
        let timer;
        if (step === 2) {
          timer = setTimeout(() => {
            setStep(3);
          }, 1500);
        }
        return () => {
          if (timer) clearTimeout(timer);
        };
      }, [step]);

      // STEP 3: Profile submit
      const handleProfileSubmit = (e) => {
        if (e) e.preventDefault();
        const finalName = fullName.trim() || (selectedDemo === 'caregiver' ? 'Rahul' : 'Kamala');
        const finalAge = age || (selectedDemo === 'caregiver' ? '45' : '74');
        const finalRole = role || selectedDemo;
        const initial = finalName.charAt(0).toUpperCase();

        const profile = {
          name: finalName,
          age: finalAge,
          role: finalRole,
          initials: initial
        };

        if (onAuthComplete) {
          onAuthComplete(profile);
        }
        if (onClose) {
          onClose();
        }
      };

      if (isModal && !isOpen) {
        return null;
      }

      const modalCard = (
        <div
          className="w-full max-w-[440px] bg-[#121514] border border-[#26302C] rounded-2xl overflow-hidden shadow-2xl text-[#F4F6F4] font-sans"
          onClick={(e) => e.stopPropagation()}
        >
          {/* Header & Stepper */}
          <div className="px-5 py-3.5 bg-[#1A1E1C] border-b border-[#26302C] flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-[#4ADE94]/15 border border-[#4ADE94]/30 flex items-center justify-center text-[#4ADE94]">
                <span className="material-symbols-outlined text-[18px]">spa</span>
              </div>
              <div>
                <div className="font-bold text-sm flex items-center gap-1.5 text-white">
                  MindCare
                  <span className="w-1.5 h-1.5 rounded-full bg-[#4ADE94] inline-block animate-pulse"></span>
                </div>
                <div className="text-[10px] font-mono text-[#9BA8A2]">DEMO PROTOTYPE AUTH</div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* 3 Stepper Dots */}
              <div className="flex items-center gap-1.5">
                <div className={`w-2.5 h-2.5 rounded-full transition-all ${step >= 1 ? 'bg-[#4ADE94]' : 'bg-[#26302C]'}`}></div>
                <div className="w-3.5 h-0.5 bg-[#26302C]"></div>
                <div className={`w-2.5 h-2.5 rounded-full transition-all ${step >= 2 ? 'bg-[#4ADE94]' : 'bg-[#26302C]'}`}></div>
                <div className="w-3.5 h-0.5 bg-[#26302C]"></div>
                <div className={`w-2.5 h-2.5 rounded-full transition-all ${step >= 3 ? 'bg-[#4ADE94]' : 'bg-[#26302C]'}`}></div>
              </div>

              {/* Close button in modal mode */}
              {isModal && onClose && (
                <button
                  type="button"
                  onClick={onClose}
                  title="Close modal"
                  className="w-7 h-7 rounded-md border border-[#26302C] text-[#9BA8A2] hover:text-white hover:border-[#4ADE94] flex items-center justify-center transition-all cursor-pointer"
                >
                  <span className="material-symbols-outlined text-[18px]">close</span>
                </button>
              )}
            </div>
          </div>

          {/* Step Contents */}
          <div className="p-6">
            {/* ================================================================ */}
            {/* STEP 1: DEMO SELECTION */}
            {/* ================================================================ */}
            {step === 1 && (
              <div>
                <h2 className="text-xl font-bold mb-1 text-white">Select Demo Account</h2>
                <p className="text-xs text-[#9BA8A2] mb-4 leading-relaxed">
                  Choose a persona to explore the interactive prototype without entering credentials.
                </p>

                <div className="flex flex-col gap-2.5 mb-5">
                  {/* Option 1: Caregiver (Rahul) */}
                  <button
                    type="button"
                    onClick={() => handleSelectDemo('caregiver')}
                    className={`flex items-center justify-between p-3.5 rounded-xl border transition-all text-left cursor-pointer ${
                      selectedDemo === 'caregiver'
                        ? 'border-[#4ADE94] bg-[#4ADE94]/10'
                        : 'border-[#26302C] bg-[#1A1E1C] hover:border-[#3A4740]'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-lg bg-[#4ADE94]/20 border border-[#4ADE94]/30 flex items-center justify-center text-[#4ADE94]">
                        <span className="material-symbols-outlined text-[22px]">supervisor_account</span>
                      </div>
                      <div>
                        <div className="font-bold text-sm text-white">Demo: Caregiver (Rahul)</div>
                        <div className="text-xs text-[#9BA8A2] mt-0.5">Rahul Sharma · Age 45 · Caregiver Access</div>
                      </div>
                    </div>
                    <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${
                      selectedDemo === 'caregiver'
                        ? 'border-[#4ADE94] bg-[#4ADE94]'
                        : 'border-[#3A4740] bg-transparent'
                    }`}>
                      {selectedDemo === 'caregiver' && <div className="w-1.5 h-1.5 rounded-full bg-[#0B0D0C]"></div>}
                    </div>
                  </button>

                  {/* Option 2: Patient (Kamala) */}
                  <button
                    type="button"
                    onClick={() => handleSelectDemo('patient')}
                    className={`flex items-center justify-between p-3.5 rounded-xl border transition-all text-left cursor-pointer ${
                      selectedDemo === 'patient'
                        ? 'border-[#4ADE94] bg-[#4ADE94]/10'
                        : 'border-[#26302C] bg-[#1A1E1C] hover:border-[#3A4740]'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-lg bg-[#5AA9F5]/20 border border-[#5AA9F5]/30 flex items-center justify-center text-[#5AA9F5]">
                        <span className="material-symbols-outlined text-[22px]">elderly</span>
                      </div>
                      <div>
                        <div className="font-bold text-sm text-white">Demo: Patient (Kamala)</div>
                        <div className="text-xs text-[#9BA8A2] mt-0.5">Kamala Sharma · Age 74 · Patient Companion</div>
                      </div>
                    </div>
                    <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${
                      selectedDemo === 'patient'
                        ? 'border-[#4ADE94] bg-[#4ADE94]'
                        : 'border-[#3A4740] bg-transparent'
                    }`}>
                      {selectedDemo === 'patient' && <div className="w-1.5 h-1.5 rounded-full bg-[#0B0D0C]"></div>}
                    </div>
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => setStep(2)}
                  className="w-full h-12 rounded-xl bg-[#4ADE94] hover:bg-[#3BC482] text-[#0B0D0C] font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer shadow-lg active:scale-[0.99]"
                >
                  <span>Next</span>
                  <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
              </div>
            )}

            {/* ================================================================ */}
            {/* STEP 2: AUTO-FILLED OTP */}
            {/* ================================================================ */}
            {step === 2 && (
              <div>
                <div className="flex items-center justify-between mb-3">
                  <button
                    type="button"
                    onClick={() => setStep(1)}
                    className="text-[#4ADE94] text-xs flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0 hover:underline"
                  >
                    <span className="material-symbols-outlined text-[15px]">arrow_back</span>
                    <span>Change account</span>
                  </button>
                  <span className="font-mono text-[11px] text-[#9BA8A2]">STEP 2 / 3</span>
                </div>

                <h2 className="text-xl font-bold mb-1 text-white">Auto-Verifying Code</h2>
                <p className="text-xs text-[#9BA8A2] mb-4 leading-relaxed">
                  Simulating instant code verification for <strong className="text-white">{selectedDemo === 'caregiver' ? 'Rahul (Caregiver)' : 'Kamala (Patient)'}</strong>.
                </p>

                {/* 6 Auto-filled boxes */}
                <div className="flex justify-between gap-1.5 max-w-[300px] mx-auto mb-4">
                  {['1', '2', '3', '4', '5', '6'].map((digit, idx) => (
                    <div
                      key={idx}
                      className="w-10 h-12 rounded-lg bg-[#4ADE94]/10 border border-[#4ADE94] text-[#4ADE94] font-mono text-xl font-bold flex items-center justify-center select-none"
                    >
                      {digit}
                    </div>
                  ))}
                </div>

                {/* Verifying Status */}
                <div className="p-3.5 rounded-xl bg-[#4ADE94]/10 border border-[#4ADE94]/30 flex items-center justify-center gap-2.5 mb-3">
                  <div className="w-4 h-4 border-2 border-[#4ADE94] border-t-transparent rounded-full animate-spin"></div>
                  <span className="text-xs font-semibold text-[#4ADE94]">Verifying automatically...</span>
                </div>
                <div className="text-center text-[11px] text-[#9BA8A2] font-mono">
                  Auto-advancing in 1.5 seconds...
                </div>
              </div>
            )}

            {/* ================================================================ */}
            {/* STEP 3: PROFILE ONBOARDING */}
            {/* ================================================================ */}
            {step === 3 && (
              <form onSubmit={handleProfileSubmit}>
                <h2 className="text-xl font-bold mb-1 text-white">Profile Onboarding</h2>
                <p className="text-xs text-[#9BA8A2] mb-4 leading-relaxed">
                  Pre-filled from your demo selection. Review details and enter the app.
                </p>

                <div className="mb-3">
                  <label className="block text-[10px] font-mono uppercase text-[#9BA8A2] mb-1 font-semibold">Full Name</label>
                  <input
                    type="text"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    required
                    className="w-full h-11 px-3 bg-[#1A1E1C] border border-[#26302C] rounded-lg text-white text-sm outline-none focus:border-[#4ADE94] transition-all"
                  />
                </div>

                <div className="mb-3.5">
                  <label className="block text-[10px] font-mono uppercase text-[#9BA8A2] mb-1 font-semibold">Age</label>
                  <input
                    type="number"
                    min="1"
                    max="120"
                    value={age}
                    onChange={(e) => setAge(e.target.value)}
                    required
                    className="w-full h-11 px-3 bg-[#1A1E1C] border border-[#26302C] rounded-lg text-white text-sm outline-none focus:border-[#4ADE94] transition-all"
                  />
                </div>

                {/* Role Selection */}
                <div className="mb-4">
                  <label className="block text-[10px] font-mono uppercase text-[#9BA8A2] mb-1.5 font-semibold">Role</label>
                  <div className="flex flex-col gap-2">
                    <div
                      onClick={() => setRole('caregiver')}
                      className={`flex items-center justify-between p-2.5 rounded-lg border cursor-pointer transition-all ${
                        role === 'caregiver'
                          ? 'border-[#4ADE94] bg-[#4ADE94]/10'
                          : 'border-[#26302C] bg-[#1A1E1C]'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="material-symbols-outlined text-[18px] text-[#4ADE94]">supervisor_account</span>
                        <div>
                          <div className="font-bold text-xs text-white">Caregiver</div>
                          <div className="text-[10px] text-[#9BA8A2]">Clinical Dashboard</div>
                        </div>
                      </div>
                      <div className={`w-3.5 h-3.5 rounded-full border flex items-center justify-center ${
                        role === 'caregiver' ? 'border-[#4ADE94] bg-[#4ADE94]' : 'border-[#3A4740]'
                      }`}>
                        {role === 'caregiver' && <div className="w-1.5 h-1.5 rounded-full bg-[#0B0D0C]"></div>}
                      </div>
                    </div>

                    <div
                      onClick={() => setRole('patient')}
                      className={`flex items-center justify-between p-2.5 rounded-lg border cursor-pointer transition-all ${
                        role === 'patient'
                          ? 'border-[#4ADE94] bg-[#4ADE94]/10'
                          : 'border-[#26302C] bg-[#1A1E1C]'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="material-symbols-outlined text-[18px] text-[#5AA9F5]">elderly</span>
                        <div>
                          <div className="font-bold text-xs text-white">Patient</div>
                          <div className="text-[10px] text-[#9BA8A2]">Care Companion View</div>
                        </div>
                      </div>
                      <div className={`w-3.5 h-3.5 rounded-full border flex items-center justify-center ${
                        role === 'patient' ? 'border-[#4ADE94] bg-[#4ADE94]' : 'border-[#3A4740]'
                      }`}>
                        {role === 'patient' && <div className="w-1.5 h-1.5 rounded-full bg-[#0B0D0C]"></div>}
                      </div>
                    </div>
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full h-12 rounded-xl bg-[#4ADE94] hover:bg-[#3BC482] text-[#0B0D0C] font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer shadow-lg active:scale-[0.99]"
                >
                  <span>Save & Enter App</span>
                  <span className="material-symbols-outlined text-[18px]">login</span>
                </button>
              </form>
            )}
          </div>
        </div>
      );

      if (isModal) {
        return (
          <div
            className="fixed inset-0 z-[99999] bg-[#0B0D0C]/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
            onClick={onClose}
          >
            {modalCard}
          </div>
        );
      }

      return modalCard;
    }

    // ====================================================================
    // MAIN APPLICATION WRAPPER (Caregiver Dashboard + Patient Smartphone Frame)
    // ====================================================================
    function MainApp({ userProfile, onOpenLoginModal, onSignOut }) {
      const [viewRole, setViewRole] = useState('patient');
      const [activeScreen, setActiveScreen] = useState('09-dashboard-overview.html');
      const [patientScreen, setPatientScreen] = useState('01-patient-home.html');

      useEffect(() => {
        // Requirement 3: NO MATTER WHAT role was selected during login, ALWAYS route to Patient View (Home Screen)
        setViewRole('patient');
      }, [userProfile]);

      const isCaregiver = viewRole === 'caregiver';

      return (
        <div className="min-h-screen flex flex-col bg-[#0B0D0C]">
          
          {/* Top Demo Bar & User Info */}
          <header className="h-14 bg-[#121514] border-b border-[#26302C] px-4 sm:px-6 hidden md:flex items-center justify-between z-30 flex-shrink-0">
            <div className="flex items-center gap-3">
              <div className="w-7 h-7 rounded-lg bg-[#4ADE94]/15 border border-[#4ADE94]/30 flex items-center justify-center text-[#4ADE94]">
                <span className="material-symbols-outlined text-[18px]">spa</span>
              </div>
              <span className="font-bold text-sm text-white">MindCare Platform</span>
              <span className="hidden sm:inline-block text-[10px] font-mono px-2 py-0.5 rounded bg-[#4ADE94]/10 text-[#4ADE94] border border-[#4ADE94]/20 uppercase">
                PROTOTYPE READY
              </span>
            </div>

            {/* Profile Info & Controls */}
            <div className="flex items-center gap-3">
              {/* Circular Profile/Avatar Button in Top-Right Corner */}
              <button
                onClick={onOpenLoginModal}
                title="Demo Profile / Switch Account"
                className="relative w-9 h-9 rounded-full border border-[#26302C] hover:border-[#4ADE94] bg-[#1A1E1C] flex items-center justify-center transition-all cursor-pointer"
              >
                {userProfile?.initials ? (
                  <span className="font-bold text-sm text-[#4ADE94]">{userProfile.initials}</span>
                ) : (
                  <span className="material-symbols-outlined text-[19px] text-[#9BA8A2]">person</span>
                )}
                {/* Active green dot indicator */}
                {userProfile && (
                  <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-[#4ADE94] border-2 border-[#0B0D0C]"></span>
                )}
              </button>

              {/* Profile Pill */}
              {userProfile && (
                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#1A1E1C] border border-[#26302C] text-xs">
                  <span className="text-white font-medium">{userProfile.name}</span>
                  <span className="text-[#9BA8A2] font-mono text-[10px]">
                    ({userProfile.role === 'patient' ? `Patient · Age ${userProfile.age}` : 'Caregiver'})
                  </span>
                </div>
              )}

              {/* Role Toggle Switcher */}
              {/* Requirement 4: Hide the top-level Caregiver Dashboard / Patient View toggle buttons from UI completely */}
              <button
                style={{ display: 'none' }}
                onClick={() => setViewRole(isCaregiver ? 'patient' : 'caregiver')}
                className="hidden"
                title="Quick switch preview role"
              >
                <span className="material-symbols-outlined text-[16px]">sync_alt</span>
                <span>Switch Role</span>
              </button>

              {/* Sign Out Button */}
              <button
                onClick={onSignOut}
                className="px-3 py-1.5 rounded-lg border border-[#EF5A5A]/40 bg-[#EF5A5A]/10 hover:bg-[#EF5A5A]/20 text-[#EF5A5A] text-xs font-semibold transition-all cursor-pointer flex items-center gap-1"
                title="Switch account / Reset"
              >
                <span className="material-symbols-outlined text-[16px]">logout</span>
                <span className="hidden sm:inline">Sign Out</span>
              </button>
            </div>
          </header>

          {/* Main Content Area: Intelligent Routing */}
          <div className="flex-1 flex overflow-hidden">
            {isCaregiver ? (
              // Caregiver Dashboard Shell
              <div className="flex-1 flex overflow-hidden">
                {/* 4 Core Tabs Sidebar */}
                <aside className="w-56 bg-[#121514] border-r border-[#26302C] flex flex-col justify-between p-3 flex-shrink-0">
                  <div className="space-y-1">
                    <div className="text-[10px] font-mono text-[#7FE0AC] px-3 py-2 uppercase tracking-wider">
                      NAVIGATION
                    </div>
                    <button
                      onClick={() => setActiveScreen('09-dashboard-overview.html')}
                      className={`w-full text-left px-3.5 py-2.5 rounded-lg text-xs font-medium flex items-center gap-2.5 transition-all cursor-pointer ${
                        activeScreen === '09-dashboard-overview.html' ? 'bg-[#4ADE94]/15 text-[#4ADE94] font-bold' : 'text-[#9BA8A2] hover:bg-[#1A1E1C] hover:text-white'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">space_dashboard</span>
                      <span>Overview</span>
                    </button>
                    <button
                      onClick={() => setActiveScreen('10-medication-manager.html')}
                      className={`w-full text-left px-3.5 py-2.5 rounded-lg text-xs font-medium flex items-center gap-2.5 transition-all cursor-pointer ${
                        activeScreen === '10-medication-manager.html' ? 'bg-[#4ADE94]/15 text-[#4ADE94] font-bold' : 'text-[#9BA8A2] hover:bg-[#1A1E1C] hover:text-white'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">medication</span>
                      <span>Medication</span>
                    </button>
                    <button
                      onClick={() => setActiveScreen('11-cognitive-analytics.html')}
                      className={`w-full text-left px-3.5 py-2.5 rounded-lg text-xs font-medium flex items-center gap-2.5 transition-all cursor-pointer ${
                        activeScreen === '11-cognitive-analytics.html' ? 'bg-[#4ADE94]/15 text-[#4ADE94] font-bold' : 'text-[#9BA8A2] hover:bg-[#1A1E1C] hover:text-white'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">psychology</span>
                      <span>Games & Analytics</span>
                    </button>
                    <button
                      onClick={() => setActiveScreen('12-family-vault-management.html')}
                      className={`w-full text-left px-3.5 py-2.5 rounded-lg text-xs font-medium flex items-center gap-2.5 transition-all cursor-pointer ${
                        activeScreen === '12-family-vault-management.html' ? 'bg-[#4ADE94]/15 text-[#4ADE94] font-bold' : 'text-[#9BA8A2] hover:bg-[#1A1E1C] hover:text-white'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[18px]">photo_library</span>
                      <span>Family Vault</span>
                    </button>
                  </div>

                  {/* Active Patient Profile Badge */}
                  <div className="p-2.5 rounded-xl bg-[#1A1E1C] border border-[#26302C] text-xs">
                    <div className="text-[10px] font-mono text-[#9BA8A2] uppercase">Active Patient</div>
                    <div className="font-bold text-white mt-0.5">{userProfile?.role === 'patient' ? userProfile.name : 'Kamala Sharma'}</div>
                    <div className="text-[10px] font-mono text-[#4ADE94]">Age {userProfile?.role === 'patient' ? userProfile.age : '74'} · #CL-8821</div>
                  </div>
                </aside>

                {/* Dashboard iframe */}
                <main className="flex-1 bg-[#0B0D0C] relative">
                  <iframe
                    src={`dashboard/${activeScreen}`}
                    className="w-full h-full border-0"
                    title="Caregiver Screen"
                  />
                </main>
              </div>
            ) : (
              // Patient View Smartphone Chassis
              <div className="flex-1 flex items-stretch md:items-center justify-center p-0 md:p-6 bg-transparent md:bg-slate-900">
                <div className="w-full h-screen md:w-[412px] md:h-[860px] md:max-h-[94vh] border-0 md:border-[10px] md:border-slate-950 rounded-none md:rounded-[40px] shadow-none md:shadow-2xl bg-white overflow-hidden flex flex-col relative">
                  
                  {/* Dynamic Island */}
                  <div className="hidden md:flex w-28 h-4 bg-slate-950 rounded-full mx-auto mt-2 absolute top-2 left-1/2 -translate-x-1/2 z-50 pointer-events-none items-center justify-end px-2.5">
                    <div className="w-2 h-2 rounded-full bg-[#1e293b]"></div>
                  </div>

                  {/* Pinned Status Bar */}
                  <div className="hidden md:flex h-9 w-full px-7 items-center justify-between text-[11px] font-semibold text-slate-800 select-none z-40 bg-white/95 backdrop-blur-xs flex-shrink-0 pt-1 border-b border-slate-100">
                    <span>9:41</span>
                    <div className="flex items-center gap-1.5 text-slate-700">
                      <span className="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
                      <span className="material-symbols-outlined text-[14px]">wifi</span>
                      <span className="material-symbols-outlined text-[15px]">battery_full</span>
                    </div>
                  </div>

                  {/* Patient Screen Frame */}
                  <div className="flex-1 overflow-hidden relative">
                    <iframe
                      src={`patient-view/${patientScreen}`}
                      className="w-full h-full border-0"
                      title="Patient Screen"
                    />
                  </div>

                  {/* Patient Bottom Nav */}
                  <nav className="h-16 bg-white/95 backdrop-blur-sm border-t border-slate-200 flex items-center justify-around px-2 z-40 relative">
                    <button
                      onClick={() => setPatientScreen('01-patient-home.html')}
                      className={`flex flex-col items-center justify-center gap-0.5 text-xs font-medium cursor-pointer ${
                        patientScreen === '01-patient-home.html' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[20px]">home</span>
                      <span>Home</span>
                    </button>
                    <button
                      onClick={() => setPatientScreen('03-cognitive-games-hub.html')}
                      className={`flex flex-col items-center justify-center gap-0.5 text-xs font-medium cursor-pointer ${
                        patientScreen === '03-cognitive-games-hub.html' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[20px]">sports_esports</span>
                      <span>Games</span>
                    </button>
                    <button
                      onClick={() => setPatientScreen('06-one-touch-family-calling.html')}
                      className={`flex flex-col items-center justify-center gap-0.5 text-xs font-medium cursor-pointer ${
                        patientScreen === '06-one-touch-family-calling.html' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[20px]">call</span>
                      <span>Family</span>
                    </button>
                    <button
                      onClick={() => setPatientScreen('02-medication-reminder.html')}
                      className={`flex flex-col items-center justify-center gap-0.5 text-xs font-medium cursor-pointer ${
                        patientScreen === '02-medication-reminder.html' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[20px]">medication</span>
                      <span>Meds</span>
                    </button>
                    <button
                      onClick={() => setPatientScreen('07-voice-assistant-overlay.html')}
                      className={`flex flex-col items-center justify-center gap-0.5 text-xs font-medium cursor-pointer ${
                        patientScreen === '07-voice-assistant-overlay.html' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[20px]">mic</span>
                      <span>Voice AI</span>
                    </button>
                  </nav>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ====================================================================
    // ROOT APP WITH GLOBAL AUTHENTICATION STATE (NON-BLOCKING)
    // ====================================================================
    function RootApp() {
      // 1. Initial loading state: const [isAppLoading, setIsAppLoading] = useState(true)
      const [isAppLoading, setIsAppLoading] = useState(true);

      // 2. Global isAuthenticated state: initially true with default active patient profile
      const [isAuthenticated, setIsAuthenticated] = useState(true);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [userProfile, setUserProfile] = useState(() => {
        try {
          const raw = localStorage.getItem('careloop_user_profile');
          if (raw) return JSON.parse(raw);
        } catch(_) {}
        return {
          name: 'Keshav Sharma',
          age: 74,
          role: 'patient',
          initials: 'K'
        };
      });

      // 1. useEffect hook to set isAppLoading to false after exactly 2 seconds
      useEffect(() => {
        const timer = setTimeout(() => {
          setIsAppLoading(false);
        }, 2000);
        return () => clearTimeout(timer);
      }, []);

      // 3. When login completes (Step 3: Save & Enter App), close modal and update profile
      const handleAuthComplete = (profile) => {
        setUserProfile(profile);
        setIsAuthenticated(true);
        setIsLoginModalOpen(false);
        localStorage.setItem('careloop_authenticated', 'true');
        localStorage.setItem('careloop_user_profile', JSON.stringify(profile));
        if (profile && profile.name) {
          localStorage.setItem('careloop_patient_name', profile.name);
          localStorage.setItem('careloop_user_role', profile.role || 'patient');
        }
      };

      const handleSignOut = () => {
        setUserProfile({
          name: 'Keshav Sharma',
          age: 74,
          role: 'patient',
          initials: 'K'
        });
        setIsLoginModalOpen(true);
      };

      // 1. While isAppLoading is true, render Splash Screen
      if (isAppLoading) {
        return (
          <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-b from-blue-50 to-blue-100">
            <div className="text-center">
              <div className="w-16 h-16 rounded-3xl bg-blue-500 text-white flex items-center justify-center shadow-lg mx-auto mb-4 animate-pulse">
                <span className="material-symbols-outlined text-4xl">spa</span>
              </div>
              <h1 className="text-blue-900 text-4xl font-bold tracking-tight">CareLoop</h1>
              <p className="text-blue-600/80 text-sm mt-1.5 font-medium">Cognitive Care Companion</p>
              <div className="mt-8 flex items-center justify-center gap-2">
                <div className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-bounce" style={{ animationDelay: '0ms' }}></div>
                <div className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-bounce" style={{ animationDelay: '150ms' }}></div>
                <div className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-bounce" style={{ animationDelay: '300ms' }}></div>
              </div>
            </div>
          </div>
        );
      }

      // 2 & 3. Render Patient View immediately; login is manual overlay modal only
      return (
        <>
          <MainApp
            userProfile={userProfile}
            onOpenLoginModal={() => setIsLoginModalOpen(true)}
            onSignOut={handleSignOut}
          />

          {/* 3-Step Prototype Authentication Flow as Modal Popup Only */}
          <AuthPage
            isModal={true}
            isOpen={isLoginModalOpen}
            onClose={() => setIsLoginModalOpen(false)}
            onAuthComplete={handleAuthComplete}
          />
        </>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RootApp />);
  </script>
</body>
</html>
