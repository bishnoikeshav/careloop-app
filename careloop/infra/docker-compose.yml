version: '3.8'

services:
  careloop-app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: careloop-production-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=careloop-secure-prod-token-secret-2026
      - AWS_REGION=us-east-1
      - AWS_SES_SENDER_EMAIL=support@careloop.health
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
