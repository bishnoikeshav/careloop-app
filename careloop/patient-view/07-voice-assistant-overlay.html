<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CareLoop — Bilingual Voice Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="../shared/voiceManager.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/api.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #eff6ff, #dbeafe);
      color: #1e293b;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .voice-orb {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #60A5FA 0%, #3B82F6 70%, #1D4ED8 100%);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
    }
    .voice-orb.listening {
      animation: pulse-listening 1.4s infinite alternate;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.8), 0 0 0 16px rgba(59, 130, 246, 0.15);
      transform: scale(1.08);
    }
    .voice-orb.speaking {
      animation: pulse-speaking 0.8s infinite alternate;
      background: radial-gradient(circle, #60A5FA 0%, #3B82F6 70%, #1D4ED8 100%);
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.8);
    }

    @keyframes pulse-listening {
      0% { transform: scale(1); box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
      100% { transform: scale(1.12); box-shadow: 0 0 55px rgba(59, 130, 246, 0.85); }
    }
    @keyframes pulse-speaking {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    /* Hide scrollbars while preserving scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; }

    .chip-btn {
      padding: 8px 14px;
      border-radius: 9999px;
      background: #FFFFFF;
      border: 1px solid #BFDBFE;
      color: #334155;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.15s ease;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .chip-btn:hover {
      background: #EFF6FF;
      border-color: #3B82F6;
      color: #1D4ED8;
    }
    .chip-btn:active {
      transform: scale(0.96);
    }

    .lang-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid #BFDBFE;
      color: #64748B;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .lang-pill.active {
      background: #2563EB;
      color: #FFFFFF;
      border-color: #2563EB;
    }
  </style>
</head>
<body class="p-5 pb-24 overflow-y-auto no-scrollbar max-w-[412px] mx-auto w-full flex flex-col justify-between">

  <!-- Floating Toast Error Notification Banner -->
  <div id="toast-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-sm w-[92%] bg-[#EF5A5A] text-white text-sm font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between gap-3 transition-all animate-bounce">
    <div class="flex items-center gap-2.5">
      <span class="material-symbols-outlined text-[20px] flex-shrink-0">error</span>
      <span id="toast-message" class="leading-tight">Microphone or network error</span>
    </div>
    <button onclick="hideToast()" class="text-white hover:opacity-80 p-1 font-bold text-base flex-shrink-0 cursor-pointer">✕</button>
  </div>

  <!-- TOP BAR -->
  <header class="flex items-center justify-between pb-3 border-b border-slate-200/80">
    <div class="flex items-center gap-2.5">
      <button onclick="goBack()" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-800 shadow-sm border border-slate-200 active:scale-95 transition-transform cursor-pointer" title="Back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">CareLoop AI</h1>
        <p class="text-xs text-slate-500 font-medium">Bilingual Care Companion</p>
      </div>
    </div>
  </header>

  <!-- MAIN VOICE ORB & TRANSCRIPT -->
  <main class="flex-1 flex flex-col items-center justify-center my-4 text-center">

    <!-- Interactive Glowing Voice Orb -->
    <div class="mb-3 flex flex-col items-center">
      <div id="voice-orb" onclick="toggleListening()" class="voice-orb" title="Tap to talk">
        <span id="orb-icon" class="material-symbols-outlined text-[44px]">mic</span>
      </div>
      <p id="orb-status" class="text-sm font-semibold text-blue-600 mt-2.5">
        Tap the microphone to speak
      </p>
      <p id="orb-substatus" class="text-xs text-slate-600 mt-0.5">
        "Ask about medicines, family calls, or games"
      </p>
    </div>

    <!-- Explicit Text Input Box & Send Button Right Below Microphone -->
    <div class="w-full max-w-sm mb-4 px-1">
      <form onsubmit="event.preventDefault(); submitExplicitText();" class="flex items-center gap-2 bg-white border border-blue-200 focus-within:border-blue-500 rounded-2xl p-1.5 shadow-sm transition-all">
        <input 
          id="explicit-text-input" 
          type="text" 
          placeholder="Type your question here..." 
          class="flex-1 bg-transparent px-3 py-2 text-sm text-slate-800 font-medium outline-none placeholder:text-slate-400"
          autocomplete="off"
        />
        <button 
          type="submit" 
          id="btn-send-explicit"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm flex items-center gap-1.5 shadow-md active:scale-95 transition-all cursor-pointer"
        >
          <span id="btn-send-label">Send</span>
          <span class="material-symbols-outlined text-[18px]">send</span>
        </button>
      </form>
    </div>

    <!-- Live Transcript Bubble -->
    <div id="transcript-card" class="w-full max-w-sm bg-white border border-blue-100 rounded-2xl p-4 text-left shadow-sm min-h-[90px] flex flex-col justify-center transition-all">
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-blue-500" id="live-dot"></span>
        <span id="speaker-label">YOU SAID:</span>
      </div>
      <p id="transcript-text" class="text-base font-semibold text-slate-900 italic">
        "Tap the mic or select a quick question below"
      </p>
    </div>

    <!-- AI Response Bubble -->
    <div id="response-card" class="w-full max-w-sm bg-blue-50/80 border border-blue-200 rounded-2xl p-4 text-left shadow-sm mt-3.5 hidden transition-all">
      <div class="text-[11px] font-bold uppercase tracking-wider text-blue-600 mb-1 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="material-symbols-outlined text-blue-600 text-[16px]">smart_toy</span>
          <span>CARE COMPANION:</span>
        </div>
        <button onclick="repeatResponse()" class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm active:scale-95 cursor-pointer" title="Hear Again">
          <span class="material-symbols-outlined text-sm">volume_up</span> Hear Again
        </button>
      </div>
      <p id="response-text" class="text-base font-medium text-slate-900 leading-relaxed"></p>
    </div>

  </main>

  <!-- QUICK QUERY SUGGESTION CHIPS -->
  <footer class="pb-2">
    <div class="text-xs font-semibold text-slate-500 mb-2 text-center" id="chips-title">
      Suggested Quick Questions:
    </div>
    
    <div class="flex flex-wrap gap-2 justify-center" id="chips-container">
      <!-- Injected via JS based on chosen language -->
    </div>
  </footer>

  <script>
    let currentLang = 'en';
    let isListening = false;
    let recognition = null;
    let lastResponse = '';

    const LANG_BCP47 = {
      en: 'en-IN', hi: 'hi-IN', bn: 'bn-IN', te: 'te-IN', mr: 'mr-IN',
      ta: 'ta-IN', gu: 'gu-IN', kn: 'kn-IN', ml: 'ml-IN', or: 'or-IN',
      pa: 'pa-IN', as: 'as-IN', ur: 'ur-IN', sa: 'sa-IN', kok: 'kok-IN',
      ne: 'ne-NP', sat: 'sat-IN', ks: 'ks-IN', sd: 'sd-IN', brx: 'brx-IN',
      doi: 'doi-IN', mai: 'mai-IN', mni: 'mni-IN'
    };

        const SUGGESTIONS = {
      en: [
        "When is my next medicine?",
        "Call Priya",
        "Play Memory Match",
        "What day is it today?",
        "I need help"
      ],
      hi: [
        "मेरी अगली दवाई कब है?",
        "प्रिया को कॉल करो",
        "दिमागी खेल खेलें",
        "आज कौन सा दिन है?",
        "मुझे मदद चाहिए"
      ],
      as: [
        "ঔষধ কেতিয়া খাব লাগিব?",
        "প্ৰিয়াক ফোন কৰা",
        "মেম’ৰি খেল খেলিম",
        "আজি কি বাৰ?",
        "সহায় লাগে"
      ],
      brx: [
        "मुलि माब्ला लोंनांगौ?",
        "प्रियानो फोन हर",
        "मेमरि गेलेनाय गेलेनि",
        "दिनै मा बार?",
        "मदद नांगौ"
      ]
    };

    function setLanguage(lang) {
      currentLang = lang || 'en';
      try {
        localStorage.setItem('careloop_app_language', currentLang);
        localStorage.setItem('careloop_lang', currentLang);
      } catch(e) {}

      const expInput = document.getElementById('explicit-text-input');
      const orbStatus = document.getElementById('orb-status');
      const orbSub = document.getElementById('orb-substatus');
      const transText = document.getElementById('transcript-text');
      const chipsTitle = document.getElementById('chips-title');

      if (currentLang === 'hi') {
        if (orbStatus) orbStatus.textContent = "बोलने के लिए माइक पर टैप करें";
        if (orbSub) orbSub.textContent = '"दवाई, फोन कॉल, या गेम के बारे में पूछें"';
        if (transText) transText.textContent = '"माइक दबाएं या नीचे दिए गए सुझाव चुनें"';
        if (chipsTitle) chipsTitle.textContent = "सुझाए गए सवाल:";
        if (expInput) expInput.placeholder = "यहाँ अपना सवाल लिखें...";
      } else if (currentLang === 'as') {
        if (orbStatus) orbStatus.textContent = "কথা ক'বলৈ মাইকত টিপক";
        if (orbSub) orbSub.textContent = '"ঔষধ, ফোন কল বা খেলৰ বিষয়ে সোধক"';
        if (transText) transText.textContent = '"মাইকত টিপক বা তলৰ বিকল্প বাছক"';
        if (chipsTitle) chipsTitle.textContent = "পৰামৰ্শিত প্ৰশ্ন:";
        if (expInput) expInput.placeholder = "ইয়াত আপোনাৰ প্ৰশ্ন লিখক...";
      } else if (currentLang === 'brx') {
        if (orbStatus) orbStatus.textContent = "रायज्लायनो माइक आव थु";
        if (orbSub) orbSub.textContent = '"मुलि, फोन कल, एबा गेलेनायनि सोमोनदै सों"';
        if (transText) transText.textContent = '"माइक थु एबा गाहायनि सोंनाय सायख\'"';
        if (chipsTitle) chipsTitle.textContent = "सोंथिफोर:";
        if (expInput) expInput.placeholder = "बेयाव नोंनि सोंनाय लिर...";
      } else {
        if (orbStatus) orbStatus.textContent = "Tap the microphone to speak";
        if (orbSub) orbSub.textContent = '"Ask about medicines, family calls, or games"';
        if (transText) transText.textContent = '"Tap the mic or select a quick question below"';
        if (chipsTitle) chipsTitle.textContent = "Suggested Quick Questions:";
        if (expInput) expInput.placeholder = "Type your question here...";
      }

      renderChips();
    }

    function renderChips() {
      const container = document.getElementById('chips-container');
      container.innerHTML = '';
      const list = SUGGESTIONS[currentLang] || SUGGESTIONS['hi'] || SUGGESTIONS['en'];
      list.forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'chip-btn';
        btn.textContent = text;
        btn.onclick = () => handleQuery(text);
        container.appendChild(btn);
      });
    }

    // --- NATIVE AUDIO RECORDING & GROQ WHISPER ENGINE (Works across Brave, Firefox, Chrome, Edge) ---
    let mediaRecorder = null;
    let audioChunks = [];
    let mediaStream = null;
    let audioContext = null;
    let silenceTimer = null;

    async function toggleListening() {
      // If currently recording, stop recording on second tap
      if (isListening) {
        stopRecording();
        return;
      }

      // Prevent conflicts: Cancel ongoing speech synthesis before mic starts
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Microphone access is not supported in this browser.");
        }

        // 1. Request microphone stream
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        // Check supported audio MIME type (audio/webm or audio/mp4)
        let mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported('audio/webm')) {
          if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4';
          } else {
            mimeType = '';
          }
        }

        mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);

        // 2. Collect audio data chunks on ondataavailable
        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstart = () => {
          isListening = true;
          updateOrbUI('listening');
          document.getElementById('orb-status').textContent = currentLang === 'hi' 
            ? 'सुन रहा हूँ... बोलिए (रोकने के लिए दोबारा टैप करें)' 
            : 'Listening... speak clearly (tap to finish)';
          startSilenceDetection(mediaStream);
        };

        // 3. When recording stops, package Blob and transcribe via Groq Whisper
        mediaRecorder.onstop = async () => {
          isListening = false;
          updateOrbUI('idle');
          cleanupAudioContext();

          // Stop mic tracks to release hardware
          if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
          }

          if (audioChunks.length === 0) {
            document.getElementById('orb-status').textContent = "No voice recorded. Tap to speak again.";
            return;
          }

          const actualMime = mediaRecorder.mimeType || 'audio/webm';
          const audioBlob = new Blob(audioChunks, { type: actualMime });
          const fileExt = actualMime.includes('mp4') ? 'mp4' : 'webm';

          if (audioBlob.size < 500) {
            document.getElementById('orb-status').textContent = "Voice was too short. Tap to speak again.";
            return;
          }

          // Transcribe audio using Groq Whisper API
          await transcribeWithGroqWhisper(audioBlob, fileExt);
        };

        mediaRecorder.onerror = (event) => {
          console.error("MediaRecorder error:", event);
          isListening = false;
          updateOrbUI('idle');
          cleanupAudioContext();
          document.getElementById('orb-status').textContent = "Recording error: " + (event.error?.message || "unknown");
        };

        mediaRecorder.start(250); // Slice chunks every 250ms

      } catch (err) {
        console.error("Microphone permission/access error:", err);
        isListening = false;
        updateOrbUI('idle');
        cleanupAudioContext();

        let errMsg = "";
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          errMsg = "Microphone blocked! Please allow mic permissions in your browser.";
        } else {
          errMsg = "Speech recognition failed: " + err.message;
        }
        document.getElementById('orb-status').textContent = errMsg;
        showToast(errMsg);
      }
    }

    function stopRecording() {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          mediaRecorder.stop();
        } catch (e) {
          console.warn("MediaRecorder stop error:", e);
        }
      }
    }

    // Auto-detect silence after user finishes speaking
    function startSilenceDetection(stream) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioContext = new AudioCtx();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        let hasSpoken = false;
        let silenceStart = Date.now();

        function checkAudio() {
          if (!isListening || !mediaRecorder || mediaRecorder.state !== 'recording') return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const average = sum / dataArray.length;

          // If volume rises above ambient threshold, mark as spoken
          if (average > 12) {
            hasSpoken = true;
            silenceStart = Date.now();
          } else if (hasSpoken && (Date.now() - silenceStart > 1800)) {
            // Auto stop after 1.8s of silence once user has spoken
            stopRecording();
            return;
          }

          requestAnimationFrame(checkAudio);
        }
        requestAnimationFrame(checkAudio);
      } catch (e) {
        console.warn("Silence detection init skipped:", e);
      }
    }

    function cleanupAudioContext() {
      if (audioContext && audioContext.state !== 'closed') {
        try { audioContext.close(); } catch (_) {}
      }
      audioContext = null;
    }

    // 4. GROQ WHISPER TRANSCRIPTION POST REQUEST
    async function transcribeWithGroqWhisper(audioBlob, ext) {
      document.getElementById('orb-status').textContent = "Transcribing with Whisper AI...";
      const sendBtn = document.getElementById('btn-send-explicit');
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.classList.add('opacity-70', 'cursor-not-allowed');
      }

      try {
        const formData = new FormData();
        formData.append('file', audioBlob, `audio.${ext}`);
        formData.append('model', 'whisper-large-v3');
        formData.append('prompt', 'Elderly care, medicine, health symptoms, fever, daily routines');
        if (currentLang && currentLang !== 'en') {
          formData.append('language', currentLang);
        }

        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GROQ_API_KEY}`
          },
          body: formData
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `Whisper HTTP ${res.status}`);
        }

        const data = await res.json();
        const text = data.text ? data.text.trim() : '';

        if (!text) {
          const warnMsg = "Could not detect clear speech. Please tap and try again.";
          document.getElementById('orb-status').textContent = warnMsg;
          showToast(warnMsg);
          return;
        }

        // a) Update user text box with the spoken words
        const expInput = document.getElementById('explicit-text-input');
        if (expInput) expInput.value = text;
        document.getElementById('transcript-text').textContent = `"${text}"`;

        // b) Automatically invoke the same Groq completions pipeline
        handleQuery(text);

      } catch (err) {
        console.error("Groq Whisper Transcription Error:", err);
        const errMsg = "Transcription error: " + (err.message || "Failed to process audio");
        document.getElementById('orb-status').textContent = errMsg;
        showToast(errMsg);
      } finally {
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        }
      }
    }

    function updateOrbUI(state) {
      const orb = document.getElementById('voice-orb');
      orb.className = 'voice-orb';
      if (state === 'listening') {
        orb.classList.add('listening');
        document.getElementById('orb-icon').textContent = 'graphic_eq';
      } else if (state === 'speaking') {
        orb.classList.add('speaking');
        document.getElementById('orb-icon').textContent = 'volume_up';
      } else {
        document.getElementById('orb-icon').textContent = 'mic';
      }
    }

    // Groq API Key: Reads from window / localStorage or empty prompt
    const GROQ_API_KEY = (typeof window !== 'undefined' && (window.CARELOOP_GROQ_KEY || localStorage.getItem('careloop_groq_key'))) || "";
    const SYSTEM_PROMPT = "You are a warm, patient, and friendly companion for an elderly user in India. Keep all answers under two short sentences. Use simple, everyday language. You are not a doctor. If the user asks for medical advice, gently remind them to ask their family or caregiver. Never say 'I am an AI.' Always be encouraging. If the user speaks or asks in an Indian language (such as Hindi, Bengali, Assamese, etc.), reply warmly in that same language.";

    // --- Groq AI Query Processing with Real-Time Speech Synthesis ---
    async function handleQuery(queryText) {
      if (!queryText || !queryText.trim()) return;
      stopRecording();

      // Clear any stuck audio queues first
      if (window.speechSynthesis) window.speechSynthesis.cancel();

      document.getElementById('transcript-text').textContent = `"${queryText}"`;
      document.getElementById('orb-status').textContent = 'Companion is thinking...';

      const sendBtn = document.getElementById('btn-send-explicit');
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.classList.add('opacity-70', 'cursor-not-allowed');
      }

      // Show animated thinking state in response card
      const responseCard = document.getElementById('response-card');
      const responseText = document.getElementById('response-text');
      responseCard.classList.remove('hidden');
      responseText.innerHTML = '<span class="text-blue-600 font-bold flex items-center gap-2"><span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span> Companion is thinking...</span>';

      try {
        const langNames = {
          en: "English",
          hi: "Hindi (हिन्दी)",
          as: "Assamese (অসমীয়া)",
          brx: "Bodo (बड़ो)"
        };
        const targetLanguage = langNames[currentLang] || "English";
        const dynamicPrompt = `You are a warm, patient, and friendly companion for an elderly user in the North Eastern Region of India. You MUST respond strictly in ${targetLanguage}. Keep all answers under two short sentences. Use simple, everyday language. You are not a doctor. If the user asks for medical advice, gently remind them to ask their family or caregiver. Never say 'I am an AI.' Always be encouraging.`;

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: [
              { role: "system", content: dynamicPrompt },
              { role: "user", content: queryText }
            ]
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `API returned HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content?.trim();

        if (!reply) throw new Error("Empty response from AI");

        displayResponse(reply);
        speakAloud(reply);

        // Contextual navigation helper for games and calls
        const q = queryText.toLowerCase();
        if (q.includes('play') || q.includes('game') || q.includes('खेल') || q.includes('गेम')) {
          setTimeout(() => {
            window.parent.postMessage({ type: 'navigate', route: { role: 'patient', file: '04-game-session-memory-match.html', id: '04' } }, '*');
          }, 3500);
        } else if (q.includes('call priya') || q.includes('प्रिया को फोन') || q.includes('phone priya')) {
          setTimeout(() => {
            window.parent.postMessage({ type: 'navigate', route: { role: 'patient', file: '06-one-touch-family-calling.html', id: '06' } }, '*');
          }, 3500);
        }

      } catch (err) {
        console.error("Groq API Error:", err);
        showToast("Connection issue: " + (err.message || "Failed to reach AI"));
        const failMsg = currentLang === 'hi' 
          ? "सम्पर्क करने में समस्या हो रही है। कृपया थोड़ी देर बाद दोबारा प्रयास करें।"
          : "I am having trouble connecting right now. Please try again in a moment.";
        displayResponse(failMsg);
        speakAloud(failMsg);
      } finally {
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        }
        document.getElementById('orb-status').textContent = currentLang === 'hi' ? 'बोलने के लिए माइक पर टैप करें' : 'Tap the microphone to speak';
      }
    }

    function displayResponse(text) {
      lastResponse = text;
      const card = document.getElementById('response-card');
      const textElem = document.getElementById('response-text');
      textElem.textContent = text;
      card.classList.remove('hidden');
    }

    function speakAloud(text) {
      if (window.VoiceManager) {
        window.VoiceManager.stop();
        const langCode = LANG_BCP47[currentLang] || 'en-IN';
        updateOrbUI('speaking');
        window.VoiceManager.speak(text, {
          rate: 0.88,
          lang: langCode,
          onEnd: () => updateOrbUI('idle'),
          onError: () => updateOrbUI('idle')
        });
        return;
      }

      if (!window.speechSynthesis) return;

      // Always clear stuck browser audio queues before speaking
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      if (!window._careLoopVoiceStore) window._careLoopVoiceStore = {};
      window._careLoopVoiceStore.activeUtterance = utterance;

      utterance.rate = 0.88; // Slower, comfortable cadence for elderly
      utterance.pitch = 1.05; // Warm friendly pitch

      const langCode = LANG_BCP47[currentLang] || 'en-IN';
      utterance.lang = langCode;

      // Match regional voice if available in browser
      const voices = window.speechSynthesis.getVoices();
      const matched = voices.find(v => v.lang === langCode || v.lang.startsWith(currentLang));
      if (matched) utterance.voice = matched;

      updateOrbUI('speaking');
      utterance.onend = () => {
        if (window._careLoopVoiceStore) window._careLoopVoiceStore.activeUtterance = null;
        updateOrbUI('idle');
      };
      utterance.onerror = () => {
        if (window._careLoopVoiceStore) window._careLoopVoiceStore.activeUtterance = null;
        updateOrbUI('idle');
      };

      window.speechSynthesis.speak(utterance);
    }

    function repeatResponse() {
      if (lastResponse) speakAloud(lastResponse);
    }

    // Submit text typed right below the microphone
    function submitExplicitText() {
      const input = document.getElementById('explicit-text-input');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      input.value = '';
      handleQuery(val);
    }

    // Fallback alias
    function submitManualText() {
      submitExplicitText();
    }

    // Toast error banner controller
    function showToast(msg, duration = 5000) {
      const toast = document.getElementById('toast-banner');
      const toastMsg = document.getElementById('toast-message');
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        hideToast();
      }, duration);
    }

    function hideToast() {
      const toast = document.getElementById('toast-banner');
      if (toast) toast.classList.add('hidden');
    }

    function goBack() {
      if (window.VoiceManager) window.VoiceManager.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (window.careLoopSound) window.careLoopSound.playClick();
      window.parent.postMessage({
        type: 'navigate',
        route: { role: 'patient', file: '01-patient-home.html', id: '01' }
      }, '*');
    }

    window.addEventListener('beforeunload', () => {
      if (window.VoiceManager) window.VoiceManager.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // Sync when language is changed from main top bar
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'languageChange' && e.data.code) {
        setLanguage(e.data.code);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const initialLang = localStorage.getItem('careloop_app_language') || localStorage.getItem('careloop_lang') || 'en';
      setLanguage(initialLang);
    });
  </script>
</body>
</html>
