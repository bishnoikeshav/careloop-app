<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>CareLoop — Medication Schedule & Reminder</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="../shared/voiceManager.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/translations.js"></script>
  <script src="../shared/api.js"></script>
  <!-- Supabase Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.CARELOOP_CONFIG = {
      SUPABASE_URL: 'https://hdxqoozhrvthnobpjffl.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_wQ_JEWk80D8aVqyZg7Zgtw_LTWDY-Ea'
    };
  </script>
  <script src="../shared/supabaseClient.js"></script>
  <script src="../shared/supabaseSync.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #12201A;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    /* Hide scrollbars while preserving scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; }

    .med-card {
      border: 1px solid #E2E8F0;
      background: #FAFCFB;
      border-radius: 20px;
      padding: 16px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .med-card:hover {
      border-color: #3B82F6;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.08);
    }
    .med-card.taken {
      background: #EFF6FF;
      border-color: #BFDBFE;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 9999px;
      letter-spacing: 0.02em;
    }
    .modal-backdrop {
      background: rgba(18, 32, 26, 0.6);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="max-w-[412px] mx-auto min-h-screen flex flex-col justify-between pb-24 overflow-y-auto no-scrollbar">

  <!-- TOP HEADER -->
  <header class="pt-6 px-5 flex items-center justify-between border-b border-[#EEF3F0] pb-4">
    <div class="flex items-center gap-3">
      <button onclick="goBackHome()" class="w-10 h-10 rounded-full bg-[#F4F7F5] flex items-center justify-center text-[#12201A] hover:bg-[#E2EBE5] active:scale-95 transition-all" title="Back to Home">
        <span class="material-symbols-outlined text-[22px]">arrow_back</span>
      </button>
      <div>
        <h1 class="font-extrabold text-2xl text-[#12201A] tracking-tight" id="lbl-rx-title">Medications</h1>
        <p class="text-xs text-[#6B8C7A] font-medium" id="lbl-rx-sub">Daily Routine & Timely Doses</p>
      </div>
    </div>
    
    <button onclick="openAddModal()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[18px]">add</span>
      <span id="lbl-btn-add">Add Medicine</span>
    </button>
  </header>

  <!-- TODAY'S ROUTINE PROGRESS & STATS -->
  <section class="px-5 pt-4">
    <div class="bg-gradient-to-br from-blue-50 to-blue-100 border border-blue-200 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl bg-white shadow-sm flex items-center justify-center text-blue-600 border border-blue-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
        </div>
        <div>
          <div class="text-xs font-bold text-blue-700 uppercase tracking-wider" id="lbl-progress-title">Today's Adherence</div>
          <div class="text-xl font-black text-slate-900" id="adherence-stat">2 of 3 Taken (67%)</div>
        </div>
      </div>
      <div class="text-right">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold bg-white text-blue-600 border border-blue-200" id="pill-on-track">
          • On Track
        </span>
      </div>
    </div>
  </section>

  <!-- NEXT / UPCOMING TAKEOVER BANNER (IF ACTIVE) -->
  <section class="px-5 pt-3" id="active-alert-container">
    <!-- Populated by JS -->
  </section>

  <!-- MEDICATIONS LIST -->
  <main class="flex-1 px-5 pt-3 space-y-3" id="medications-list">
    <!-- Rendered dynamically -->
  </main>

  <!-- MODAL: ADD MORE MEDICINES -->
  <div id="add-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-[#DCE5E0] relative animate-fade-in">
      <div class="flex items-center justify-between pb-3 border-b border-[#EEF3F0]">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
            <span class="material-symbols-outlined text-[20px]">medication</span>
          </span>
          <h2 class="font-extrabold text-lg text-[#12201A]" id="lbl-modal-title">Add Medication</h2>
        </div>
        <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-[#F4F7F5] flex items-center justify-center text-[#6B8C7A] hover:text-[#12201A]">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>

      <form onsubmit="handleSaveMedicine(event)" class="mt-4 space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-[#12201A] mb-1" id="lbl-form-name">Medicine Name *</label>
          <input id="form-name" type="text" required placeholder="e.g. Lisinopril, Metformin, Vitamin D" class="w-full px-3.5 py-2.5 bg-[#F8FAF9] border border-[#DCE5E0] rounded-xl text-sm text-[#12201A] focus:border-blue-500 focus:bg-white outline-none"/>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-[#12201A] mb-1" id="lbl-form-dosage">Dosage *</label>
            <input id="form-dosage" type="text" required placeholder="e.g. 500mg, 10ml, 1 tab" class="w-full px-3.5 py-2.5 bg-[#F8FAF9] border border-[#DCE5E0] rounded-xl text-sm text-[#12201A] focus:border-blue-500 focus:bg-white outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-bold text-[#12201A] mb-1" id="lbl-form-time">Scheduled Time *</label>
            <input id="form-time" type="time" required value="08:00" class="w-full px-3.5 py-2 bg-[#F8FAF9] border border-[#DCE5E0] rounded-xl text-sm text-[#12201A] focus:border-blue-500 focus:bg-white outline-none"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#12201A] mb-1" id="lbl-form-freq">Frequency</label>
          <select id="form-freq" class="w-full px-3.5 py-2.5 bg-[#F8FAF9] border border-[#DCE5E0] rounded-xl text-sm text-[#12201A] focus:border-blue-500 focus:bg-white outline-none">
            <option value="Daily (Morning)">Daily (Morning)</option>
            <option value="Daily (Afternoon)">Daily (Afternoon)</option>
            <option value="Daily (Evening)">Daily (Evening)</option>
            <option value="Twice daily">Twice daily</option>
            <option value="As needed">As needed (SOS)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#12201A] mb-1" id="lbl-form-notes">Special Instructions</label>
          <input id="form-notes" type="text" placeholder="e.g. Take with warm water after meals" class="w-full px-3.5 py-2.5 bg-[#F8FAF9] border border-[#DCE5E0] rounded-xl text-sm text-[#12201A] focus:border-blue-500 focus:bg-white outline-none"/>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeAddModal()" class="flex-1 py-3 border border-[#DCE5E0] text-[#12201A] rounded-xl text-xs font-bold hover:bg-[#F4F7F5] transition-all">
            Cancel
          </button>
          <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all">
            Save Medicine
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Default Medication Routine
    const DEFAULT_MEDS = [
      {
        id: 'med_01',
        name: 'Metformin Hydrochloride',
        shortName: 'Metformin',
        dosage: '500mg — 1 tablet',
        time: '08:00 AM',
        rawTime: '08:00',
        frequency: 'Morning (After breakfast)',
        instructions: 'Take with warm water after breakfast',
        status: 'pending', // 'pending' | 'taken' | 'snoozed'
        category: 'morning',
        color: '#2E9E63'
      },
      {
        id: 'med_02',
        name: 'Multivitamin Complex',
        shortName: 'Multivitamin',
        dosage: '1 capsule',
        time: '01:30 PM',
        rawTime: '13:30',
        frequency: 'Afternoon (Post lunch)',
        instructions: 'Take with regular meal',
        status: 'pending',
        category: 'afternoon',
        color: '#3B82F6'
      },
      {
        id: 'med_03',
        name: 'Lisinopril',
        shortName: 'Lisinopril',
        dosage: '10mg — 1 tablet',
        time: '08:00 PM',
        rawTime: '20:00',
        frequency: 'Evening (Before dinner)',
        instructions: 'Take 30 mins before dinner. Check BP.',
        status: 'pending',
        category: 'evening',
        color: '#D97706'
      },
      {
        id: 'med_04',
        name: 'Atorvastatin',
        shortName: 'Atorvastatin',
        dosage: '20mg — 1 tablet',
        time: '10:00 PM',
        rawTime: '22:00',
        frequency: 'Bedtime',
        instructions: 'Take with half glass of water before sleep',
        status: 'pending',
        category: 'night',
        color: '#8B5CF6'
      }
    ];

    function getMedications() {
      try {
        const stored = localStorage.getItem('careloop_medications');
        if (stored) return JSON.parse(stored);
      } catch(e) {}
      localStorage.setItem('careloop_medications', JSON.stringify(DEFAULT_MEDS));
      return DEFAULT_MEDS;
    }

    function saveMedications(list) {
      localStorage.setItem('careloop_medications', JSON.stringify(list));
      renderMedications();
      // Notify parent shell / caregiver manager
      try {
        window.parent.postMessage({ type: 'medicationsUpdated', count: list.length }, '*');
      } catch(e) {}
    }

    function renderMedications() {
      const activeLang = (typeof localStorage !== 'undefined' && (localStorage.getItem('careloop_app_language') || localStorage.getItem('careloop_lang'))) || 'en';
      const t = (window.CARELOOP_TRANSLATIONS && window.CARELOOP_TRANSLATIONS[activeLang]) || (window.CARELOOP_TRANSLATIONS && window.CARELOOP_TRANSLATIONS['en']) || {};
      const list = getMedications();
      const container = document.getElementById('medications-list');
      const statEl = document.getElementById('adherence-stat');
      const alertContainer = document.getElementById('active-alert-container');

      // Calculate Stats
      const takenCount = list.filter(m => m.status === 'taken').length;
      const total = list.length;
      const pct = total > 0 ? Math.round((takenCount / total) * 100) : 0;
      if (statEl) statEl.textContent = `${takenCount} of ${total} Taken (${pct}%)`;

      // Next due medication banner
      const nextPending = list.find(m => m.status === 'pending');
      if (nextPending && alertContainer) {
        alertContainer.innerHTML = `
          <div class="bg-white border-2 border-blue-500 rounded-2xl p-4 shadow-md flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                <span class="material-symbols-outlined text-[26px]">alarm</span>
              </div>
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">DUE NOW</span>
                <div class="font-extrabold text-slate-900 text-base leading-snug">${nextPending.shortName} ${nextPending.dosage.split('—')[0]}</div>
                <div class="text-xs text-slate-500 font-medium">${nextPending.time} • ${nextPending.instructions}</div>
              </div>
            </div>
            <button onclick="markAsTaken('${nextPending.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs shadow flex items-center gap-1 active:scale-95 transition-all">
              <span class="material-symbols-outlined text-[16px]">check</span> ${t.medTakenBtn || 'Taken ✓'}
            </button>
          </div>
        `;
      } else if (alertContainer) {
        alertContainer.innerHTML = `
          <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3.5 flex items-center justify-center gap-2 text-xs font-bold text-blue-700">
            <span class="material-symbols-outlined text-[18px]">verified</span> ${t.allDosesCompleted || 'All doses for right now are completed!'}
          </div>
        `;
      }

      // Render Cards
      container.innerHTML = list.map((med) => {
        const isTaken = med.status === 'taken';
        const isSnoozed = med.status === 'snoozed';

        return `
          <div class="med-card ${isTaken ? 'taken' : ''}">
            <div class="flex items-start justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: ${isTaken ? '#DBEAFE' : '#F1F5F9'}; color: ${isTaken ? '#2563EB' : '#64748B'};">
                  <span class="material-symbols-outlined text-[22px]">${isTaken ? 'task_alt' : 'pill'}</span>
                </div>
                <div>
                  <h3 class="font-bold text-base text-[#12201A] leading-tight flex items-center gap-1.5">
                    ${med.shortName || med.name}
                    ${isTaken ? '<span class="material-symbols-outlined text-blue-600 text-[16px]">check_circle</span>' : ''}
                  </h3>
                  <p class="text-xs font-semibold text-slate-500">${med.dosage}</p>
                </div>
              </div>

              <span class="status-badge ${isTaken ? 'bg-blue-50 text-blue-700' : isSnoozed ? 'bg-[#FEF3C7] text-[#92400E]' : 'bg-[#E5E7EB] text-[#374151]'}">
                ${isTaken ? 'Taken' : isSnoozed ? 'Snoozed 15m' : med.time}
              </span>
            </div>

            <div class="mt-3 pt-2.5 border-t border-[#EEF3F0] flex items-center justify-between text-xs">
              <span class="text-slate-500 font-medium flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">info</span> ${med.instructions}
              </span>

              <div class="flex items-center gap-2">
                ${!isTaken ? `
                  <button onclick="snoozeDose('${med.id}')" class="px-2.5 py-1 rounded-lg border border-[#DCE5E0] text-slate-600 hover:bg-white text-[11px] font-semibold transition-all">
                    Snooze
                  </button>
                  <button onclick="markAsTaken('${med.id}')" class="px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold shadow-sm active:scale-95 transition-all flex items-center gap-1">
                    <span class="material-symbols-outlined text-[13px]">check</span> Mark Taken
                  </button>
                ` : `
                  <button onclick="resetDose('${med.id}')" class="px-2.5 py-1 text-[11px] font-medium text-[#6B8C7A] hover:underline">
                    Undo
                  </button>
                `}
                <button onclick="deleteDose('${med.id}')" class="p-1 text-[#9CA3AF] hover:text-[#EF4444]" title="Delete medicine">
                  <span class="material-symbols-outlined text-[16px]">delete</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function markAsTaken(id) {
      if (window.careLoopSound) window.careLoopSound.playMatch();
      const list = getMedications();
      const target = list.find(m => m.id === id);
      if (target) {
        target.status = 'taken';
        saveMedications(list);
        if (window.CareLoopSync && window.CareLoopSync.updateMedicationStatus) {
          window.CareLoopSync.updateMedicationStatus(id, 'taken').catch(function(err) {
            console.warn('[Supabase] Update status failed:', err);
          });
        }
      }
    }

    function snoozeDose(id) {
      if (window.careLoopSound) window.careLoopSound.playClick();
      const list = getMedications();
      const target = list.find(m => m.id === id);
      if (target) {
        target.status = 'snoozed';
        saveMedications(list);
        if (window.CareLoopSync && window.CareLoopSync.updateMedicationStatus) {
          window.CareLoopSync.updateMedicationStatus(id, 'snoozed').catch(function(err) {
            console.warn('[Supabase] Update status failed:', err);
          });
        }
      }
    }

    function resetDose(id) {
      const list = getMedications();
      const target = list.find(m => m.id === id);
      if (target) {
        target.status = 'pending';
        saveMedications(list);
        if (window.CareLoopSync && window.CareLoopSync.updateMedicationStatus) {
          window.CareLoopSync.updateMedicationStatus(id, 'pending').catch(function(err) {
            console.warn('[Supabase] Update status failed:', err);
          });
        }
      }
    }

    function deleteDose(id) {
      if (!confirm('Remove this medication from your daily schedule?')) return;
      let list = getMedications();
      list = list.filter(m => m.id !== id);
      saveMedications(list);
      if (window.CareLoopSync && window.CareLoopSync.deleteMedication) {
        window.CareLoopSync.deleteMedication(id).catch(function(err) {
          console.warn('[Supabase] Delete medication failed:', err);
        });
      }
    }

    function openAddModal() {
      if (window.careLoopSound) window.careLoopSound.playClick();
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function handleSaveMedicine(e) {
      e.preventDefault();
      const name = document.getElementById('form-name').value.trim();
      const dosage = document.getElementById('form-dosage').value.trim();
      const rawTime = document.getElementById('form-time').value;
      const freq = document.getElementById('form-freq').value;
      const notes = document.getElementById('form-notes').value.trim() || 'Take as prescribed';

      if (!name || !dosage) return;

      // Format time string
      const [h, m] = rawTime.split(':');
      let hour = parseInt(h, 10);
      const ampm = hour >= 12 ? 'PM' : 'AM';
      hour = hour % 12 || 12;
      const formattedTime = `${hour}:${m} ${ampm}`;

      const newMed = {
        id: 'med_' + Date.now(),
        name: name,
        shortName: name.split(' ')[0],
        dosage: dosage,
        time: formattedTime,
        rawTime: rawTime,
        frequency: freq,
        instructions: notes,
        status: 'pending',
        category: 'custom',
        color: '#2E9E63'
      };

      const list = getMedications();
      list.push(newMed);
      saveMedications(list);

      if (window.CareLoopSync && window.CareLoopSync.upsertMedication) {
        window.CareLoopSync.upsertMedication(newMed).catch(function(err) {
          console.warn('[Supabase] Upsert new med failed:', err);
        });
      }

      if (window.careLoopSound) window.careLoopSound.playSuccess();
      closeAddModal();
      document.getElementById('form-name').value = '';
      document.getElementById('form-dosage').value = '';
      document.getElementById('form-notes').value = '';
    }

    function goBackHome() {
      if (window.VoiceManager) window.VoiceManager.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (window.careLoopSound) window.careLoopSound.playClick();
      window.parent.postMessage({
        type: 'navigate',
        route: { role: 'patient', file: '01-patient-home.html', id: '01' }
      }, '*');
    }

    window.addEventListener('beforeunload', () => {
      if (window.VoiceManager) window.VoiceManager.stop();
      else if (window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // Language Support
    function applyLanguage(code) {
      const activeCode = code || (typeof localStorage !== 'undefined' && (localStorage.getItem('careloop_app_language') || localStorage.getItem('careloop_lang'))) || 'en';
      if (typeof window.applyTranslationsToDOM === 'function') {
        window.applyTranslationsToDOM(activeCode);
      }
      const t = (window.CARELOOP_TRANSLATIONS && window.CARELOOP_TRANSLATIONS[activeCode])
        || (window.CARELOOP_TRANSLATIONS && window.CARELOOP_TRANSLATIONS['en'])
        || {};

      if (t.medication && document.getElementById('lbl-rx-title')) document.getElementById('lbl-rx-title').textContent = t.medication;
      if (t.viewRx && document.getElementById('lbl-rx-sub')) document.getElementById('lbl-rx-sub').textContent = t.viewRx;
      if (t.adherenceRate && document.getElementById('lbl-progress-title')) document.getElementById('lbl-progress-title').textContent = t.adherenceRate;

      renderMedications();
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'languageChange' && e.data.code) {
        applyLanguage(e.data.code);
      }
      if (e.data && e.data.type === 'medicationsUpdated') {
        renderMedications();
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      renderMedications();
      const currentLang = localStorage.getItem('careloop_app_language') || localStorage.getItem('careloop_lang') || 'en';
      applyLanguage(currentLang);

      // Async sync from Supabase if available
      if (window.CareLoopSync && window.CareLoopSync.fetchMedications) {
        try {
          const cloudMeds = await window.CareLoopSync.fetchMedications();
          if (cloudMeds && cloudMeds.length > 0) {
            renderMedications();
          } else {
            // If Supabase table is empty, seed defaults to cloud
            const localMeds = getMedications();
            window.CareLoopSync.syncAllMedications(localMeds).catch(() => {});
          }
        } catch(err) {
          console.warn('[Supabase] Initial med fetch error (using local):', err);
        }
      }
    });
  </script>
</body>
</html>
