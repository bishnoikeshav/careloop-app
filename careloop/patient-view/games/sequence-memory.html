<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CareLoop — Sequence Memory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/api.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      color: #12201A;
      user-select: none;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .tile-pad {
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 18px rgba(18, 32, 26, 0.06);
    }
    .tile-pad:active {
      transform: scale(0.94);
    }

    /* 4 Distinct Peaceful Colors */
    .pad-green { background: #E4F5EB; color: #1E7A4A; border-color: #BEE3CE; }
    .pad-blue  { background: #E6F0FA; color: #2062A8; border-color: #C1DBF5; }
    .pad-amber { background: #FCF4E3; color: #9A650C; border-color: #F7DFB0; }
    .pad-rose  { background: #FCEBEB; color: #A82828; border-color: #F7C6C6; }

    /* Active Glowing State */
    .pad-green.active { background: #2E9E63 !important; color: #FFF !important; transform: scale(1.05); box-shadow: 0 0 24px rgba(46, 158, 99, 0.5); }
    .pad-blue.active  { background: #3B82F6 !important; color: #FFF !important; transform: scale(1.05); box-shadow: 0 0 24px rgba(59, 130, 246, 0.5); }
    .pad-amber.active { background: #F59E0B !important; color: #FFF !important; transform: scale(1.05); box-shadow: 0 0 24px rgba(245, 158, 11, 0.5); }
    .pad-rose.active  { background: #EF4444 !important; color: #FFF !important; transform: scale(1.05); box-shadow: 0 0 24px rgba(239, 68, 68, 0.5); }

    .pulse-glow {
      box-shadow: 0 0 0 0 rgba(46, 158, 99, 0.4);
      animation: pulseGreen 1.8s infinite;
    }
    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(46, 158, 99, 0.4); }
      70% { box-shadow: 0 0 0 16px rgba(46, 158, 99, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 158, 99, 0); }
    }
  </style>
</head>
<body class="p-5 flex flex-col justify-between">

  <!-- TOP BAR -->
  <header class="flex items-center justify-between pb-3 pt-1 border-b border-[#E8EFEA]">
    <div class="flex items-center gap-3">
      <button onclick="goBack()" class="w-10 h-10 rounded-full bg-[#F4F7F5] flex items-center justify-center text-[#12201A] active:scale-95 transition-transform" title="Back to games">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-[#12201A]">Sequence Memory</h1>
        <p class="text-xs text-[#527863] font-medium">Watch the sequence, then tap</p>
      </div>
    </div>

    <!-- Step Badge -->
    <div class="bg-[#F4F7F5] border border-[#DCE5E0] px-3 py-1 rounded-full text-xs font-bold text-[#2E9E63]">
      Level <span id="level-num">1</span>/5
    </div>
  </header>

  <!-- PROMPT RIBBON -->
  <div class="py-2.5 px-4 bg-[#F8FAF9] rounded-2xl my-3 border border-[#E3ECE7] text-center">
    <span class="text-sm font-semibold text-[#12201A]" id="guide-text">Watch closely...</span>
  </div>

  <!-- 4 COLOR PADS GRID -->
  <main class="flex-1 flex items-center justify-center my-2">
    <div class="grid grid-cols-2 gap-4 w-full max-w-[320px]">
      <button id="pad-0" onclick="handleUserTap(0)" class="tile-pad pad-green">
        <span class="text-3xl mb-1">🌿</span>
        <span class="text-xs font-bold uppercase tracking-wider">Green</span>
      </button>
      <button id="pad-1" onclick="handleUserTap(1)" class="tile-pad pad-blue">
        <span class="text-3xl mb-1">💧</span>
        <span class="text-xs font-bold uppercase tracking-wider">Blue</span>
      </button>
      <button id="pad-2" onclick="handleUserTap(2)" class="tile-pad pad-amber">
        <span class="text-3xl mb-1">☀️</span>
        <span class="text-xs font-bold uppercase tracking-wider">Sun</span>
      </button>
      <button id="pad-3" onclick="handleUserTap(3)" class="tile-pad pad-rose">
        <span class="text-3xl mb-1">🌸</span>
        <span class="text-xs font-bold uppercase tracking-wider">Rose</span>
      </button>
    </div>
  </main>

  <!-- BOTTOM HINT -->
  <footer class="text-center py-2">
    <p class="text-xs text-[#6B8C7A] font-medium">
      Designed for working memory & temporal sequencing
    </p>
  </footer>

  <!-- COMPLETION MODAL -->
  <div id="celebration-overlay" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="w-20 h-20 bg-[#2E9E63] rounded-full flex items-center justify-center text-white mb-5 shadow-lg pulse-glow">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
    </div>

    <h2 class="text-3xl font-bold text-[#12201A] mb-2 tracking-tight">Brilliant Recall!</h2>
    <p class="text-base text-[#527863] max-w-xs mb-6 leading-relaxed">
      You remembered the sequence with calm precision. Exercises like this enhance mental stamina.
    </p>

    <div class="bg-[#F4F7F5] border border-[#DCE5E0] rounded-2xl p-4 w-full max-w-xs mb-6 flex justify-around">
      <div>
        <div class="text-2xl font-bold text-[#2E9E63]" id="summary-level">5/5</div>
        <div class="text-[11px] text-[#6B8C7A] uppercase font-semibold">Levels</div>
      </div>
      <div class="w-px bg-[#DCE5E0]"></div>
      <div>
        <div class="text-2xl font-bold text-[#12201A]" id="summary-time">28s</div>
        <div class="text-[11px] text-[#6B8C7A] uppercase font-semibold">Time</div>
      </div>
      <div class="w-px bg-[#DCE5E0]"></div>
      <div>
        <div class="text-2xl font-bold text-[#2E9E63]" id="summary-cas">91</div>
        <div class="text-[11px] text-[#6B8C7A] uppercase font-semibold">CAS Score</div>
      </div>
    </div>

    <div class="flex flex-col gap-3 w-full max-w-xs">
      <button onclick="startSession()" class="w-full h-14 bg-[#2E9E63] hover:bg-[#258552] text-white rounded-2xl font-semibold text-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <span>Play Again</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
      <button onclick="goBack()" class="w-full h-12 bg-[#F4F7F5] hover:bg-[#EAF1ED] text-[#12201A] border border-[#DCE5E0] rounded-2xl font-medium text-base transition-all active:scale-[0.98]">
        Back to Games Hub
      </button>
    </div>
  </div>

  <script>
    let sequence = [];
    let userStep = 0;
    let currentLevel = 1;
    const MAX_LEVEL = 5;
    let isShowingSequence = false;
    let startTime = null;

    // Frequencies for each pad sound
    const FREQS = [329.63, 392.00, 440.00, 523.25]; // E4, G4, A4, C5 soothing notes

    function playPadSound(idx) {
      if (!window.careLoopSound) return;
      window.careLoopSound.init();
      const ctx = window.careLoopSound.ctx;
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = FREQS[idx] || 440;
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.38);
      } catch (e) {}
    }

    function startSession() {
      sequence = [];
      currentLevel = 1;
      startTime = Date.now();

      const overlay = document.getElementById('celebration-overlay');
      overlay.classList.add('opacity-0', 'pointer-events-none');

      nextLevel();
    }

    function nextLevel() {
      document.getElementById('level-num').textContent = currentLevel;
      // Add a random pad (0 to 3)
      sequence.push(Math.floor(Math.random() * 4));
      userStep = 0;
      playSequence();
    }

    function playSequence() {
      isShowingSequence = true;
      document.getElementById('guide-text').textContent = '👀 Watch the sequence...';
      disablePads(true);

      let i = 0;
      const interval = setInterval(() => {
        if (i >= sequence.length) {
          clearInterval(interval);
          isShowingSequence = false;
          disablePads(false);
          document.getElementById('guide-text').textContent = '👉 Your turn! Tap the sequence.';
          return;
        }

        flashPad(sequence[i]);
        i++;
      }, 750);
    }

    function flashPad(idx) {
      const pad = document.getElementById(`pad-${idx}`);
      if (!pad) return;

      playPadSound(idx);
      pad.classList.add('active');
      setTimeout(() => {
        pad.classList.remove('active');
      }, 400);
    }

    function handleUserTap(idx) {
      if (isShowingSequence) return;

      flashPad(idx);

      if (idx === sequence[userStep]) {
        // Correct tap
        userStep++;

        if (userStep === sequence.length) {
          // Completed this level!
          if (window.careLoopSound) window.careLoopSound.playMatch();
          document.getElementById('guide-text').textContent = '✓ Perfect!';

          if (currentLevel >= MAX_LEVEL) {
            handleVictory();
          } else {
            currentLevel++;
            setTimeout(() => {
              nextLevel();
            }, 1000);
          }
        }
      } else {
        // Mistake - repeat sequence gently without punishment
        if (window.careLoopSound) window.careLoopSound.playMismatch();
        document.getElementById('guide-text').textContent = "Let's try that sequence again...";
        setTimeout(() => {
          userStep = 0;
          playSequence();
        }, 1200);
      }
    }

    function disablePads(disable) {
      for (let i = 0; i < 4; i++) {
        const p = document.getElementById(`pad-${i}`);
        if (p) p.disabled = disable;
      }
    }

    function handleVictory() {
      const elapsedSec = Math.max(15, Math.round((Date.now() - startTime) / 1000));
      const casScore = Math.min(99, Math.round(92 - (elapsedSec > 40 ? (elapsedSec - 40) * 0.5 : 0)));

      document.getElementById('summary-level').textContent = `${MAX_LEVEL}/${MAX_LEVEL}`;
      document.getElementById('summary-time').textContent = elapsedSec + 's';
      document.getElementById('summary-cas').textContent = casScore;

      if (window.careLoopSound) {
        setTimeout(() => window.careLoopSound.playMatch(), 200);
      }

      if (window.careLoopApi) {
        window.careLoopApi.recordGame({
          gameType: 'sequence-memory',
          gameTitle: 'Sequence Memory',
          accuracy: 100,
          durationSec: elapsedSec,
          moves: sequence.length
        });
      }

      const overlay = document.getElementById('celebration-overlay');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function goBack() {
      if (window.careLoopSound) window.careLoopSound.playClick();
      window.parent.postMessage({
        type: 'navigate',
        route: { role: 'patient', file: '03-cognitive-games-hub.html', id: '03' }
      }, '*');
    }

    window.addEventListener('DOMContentLoaded', startSession);
  </script>
</body>
</html>
