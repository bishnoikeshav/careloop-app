<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CareLoop — React Cognitive Games Suite</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM, Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="shared/voiceManager.js"></script>
  <script src="shared/sound.js"></script>
  <script src="shared/api.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Hidden scrollbars for clean phone chassis */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-transparent md:bg-slate-900 min-h-screen py-0 md:py-6 flex items-stretch md:items-center justify-center">

  <!-- AUTHENTIC MODERN SMARTPHONE CHASSIS (Standard 9:19.5 Aspect Ratio) -->
  <div class="w-full h-screen md:w-[412px] md:h-[860px] md:max-h-[94vh] rounded-none md:rounded-[40px] border-0 md:border-[10px] md:border-slate-950 shadow-none md:shadow-2xl bg-white overflow-hidden flex flex-col relative">

    <!-- Sleek Top Notch / Dynamic Island Pill -->
    <div class="hidden md:flex w-28 h-4 bg-slate-950 rounded-full mx-auto mt-2 absolute top-2 left-1/2 -translate-x-1/2 z-50 pointer-events-none items-center justify-end px-2.5">
      <div class="w-2 h-2 rounded-full bg-[#1e293b]"></div>
    </div>

    <!-- Pinned Top Status Bar -->
    <div class="hidden md:flex h-9 w-full px-7 items-center justify-between text-[11px] font-semibold text-slate-800 select-none z-40 bg-white/95 backdrop-blur-xs flex-shrink-0 pt-1 border-b border-slate-100">
      <span id="demo-phone-clock">9:41</span>
      <div class="flex items-center gap-1.5 text-slate-700">
        <span class="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
        <span class="material-symbols-outlined text-[14px]">wifi</span>
        <span class="material-symbols-outlined text-[15px]">battery_full</span>
      </div>
    </div>

    <!-- Scrollable Main Screen Area (with hidden scrollbar & pb-24) -->
    <div id="root" class="flex-1 overflow-y-auto overscroll-contain pb-24 px-3 py-2 no-scrollbar"></div>

  </div>

  <script>
    function updateClock() {
      const el = document.getElementById('demo-phone-clock');
      if (!el) return;
      const d = new Date();
      el.textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- GAME 1: COLOR & PATTERN RECALL ---
    function ColorPatternGame({ onFinish, onBack }) {
      const [level, setLevel] = useState(1);
      const [sequence, setSequence] = useState([]);
      const [userStep, setUserStep] = useState(0);
      const [litTile, setLitTile] = useState(null);
      const [isDemonstrating, setIsDemonstrating] = useState(false);
      const [promptText, setPromptText] = useState("Watch carefully: which colors light up?");
      const [isCompleted, setIsCompleted] = useState(false);
      const [stats, setStats] = useState({ accuracy: 100, time: 0, cas: 94 });

      const startTimeRef = useRef(Date.now());
      const attemptsRef = useRef(0);
      const correctAttemptsRef = useRef(0);
      const isDemonstratingRef = useRef(false);
      const activeUtteranceRef = useRef(null);

      const TILE_INFO = [
        { id: 0, label: "Muted Teal", colorClass: "bg-[#EAF5F0] text-[#0D9488] border-[#B5E0CE]", litClass: "bg-[#0D9488] text-white border-[#0F766E]", freq: 392.00 },
        { id: 1, label: "Warm Amber", colorClass: "bg-[#FEF6E9] text-[#D97706] border-[#F8D8A7]", litClass: "bg-[#D97706] text-white border-[#B45309]", freq: 440.00 },
        { id: 2, label: "Sky Blue", colorClass: "bg-[#EEF4FD] text-[#2563EB] border-[#BFDBFE]", litClass: "bg-[#2563EB] text-white border-[#1D4ED8]", freq: 523.25 },
        { id: 3, label: "Gentle Rose", colorClass: "bg-[#FDF0F6] text-[#DB2777] border-[#FBCFE8]", litClass: "bg-[#DB2777] text-white border-[#BE185D]", freq: 587.33 }
      ];

      const speak = useCallback((text) => {
        if (!('speechSynthesis' in window)) return;
        // ALWAYS cancel existing speech immediately to stop voice bleeding
        window.speechSynthesis.cancel();
        if (!text) return;

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 0.88; // Gentle, steady pace for seniors
        
        // Prevent Chromium GC cutoff
        activeUtteranceRef.current = u;
        window._careLoopActiveUtterance = u;
        
        u.onend = () => {
          if (activeUtteranceRef.current === u) activeUtteranceRef.current = null;
        };
        u.onerror = () => {
          if (activeUtteranceRef.current === u) activeUtteranceRef.current = null;
        };

        window.speechSynthesis.speak(u);
      }, []);

      const handleBack = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (onBack) onBack();
      };

      const playTone = useCallback((freq) => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.6);
        } catch (_) {}
      }, []);

      const flashSingleTile = useCallback((index) => {
        setLitTile(index);
        playTone(TILE_INFO[index].freq);
        setTimeout(() => {
          setLitTile(null);
        }, 700);
      }, [playTone]);

      const runDemo = useCallback((seq) => {
        setIsDemonstrating(true);
        isDemonstratingRef.current = true;
        const msg = "Watch carefully: which colors light up?";
        setPromptText(msg);
        speak(msg);

        let idx = 0;
        const timer = setInterval(() => {
          if (idx < seq.length) {
            flashSingleTile(seq[idx]);
            idx++;
          } else {
            clearInterval(timer);
            setTimeout(() => {
              setIsDemonstrating(false);
              isDemonstratingRef.current = false;
              const readyMsg = "Now tap the colors in the same order.";
              setPromptText(readyMsg);
              speak(readyMsg);
            }, 600);
          }
        }, 1200);
      }, [flashSingleTile, speak]);

      const startLevel = useCallback((lvl) => {
        setLevel(lvl);
        setUserStep(0);
        const length = lvl === 1 ? 2 : 3;
        const newSeq = Array.from({ length }, () => Math.floor(Math.random() * 4));
        setSequence(newSeq);
        setTimeout(() => {
          runDemo(newSeq);
        }, 300);
      }, [runDemo]);

      useEffect(() => {
        startTimeRef.current = Date.now();
        startLevel(1);
        return () => {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [startLevel]);

      const handleTileClick = (index) => {
        if (isDemonstratingRef.current) return;
        attemptsRef.current += 1;
        flashSingleTile(index);

        const expected = sequence[userStep];
        if (index === expected) {
          correctAttemptsRef.current += 1;
          const nextStep = userStep + 1;
          setUserStep(nextStep);

          if (nextStep === sequence.length) {
            if (level < 2) {
              setPromptText("Wonderful! Getting ready for Level 2...");
              setTimeout(() => {
                startLevel(2);
              }, 1500);
            } else {
              const elapsed = Math.max(12, Math.round((Date.now() - startTimeRef.current) / 1000));
              const acc = attemptsRef.current > 0 ? Math.min(100, Math.round((correctAttemptsRef.current / attemptsRef.current) * 100)) : 100;
              const cas = Math.min(99, Math.round((acc * 0.65) + (Math.max(20, 100 - (elapsed * 1.2)) * 0.35)));
              const res = { accuracy: acc, time: elapsed, cas };
              setStats(res);
              setIsCompleted(true);
              if (onFinish) onFinish(res);
            }
          }
        } else {
          const enc = "Take your time. Let's watch the pattern one more time.";
          setPromptText(enc);
          speak(enc);
          setUserStep(0);
          setTimeout(() => {
            runDemo(sequence);
          }, 2200);
        }
      };

      const playAgain = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsCompleted(false);
        attemptsRef.current = 0;
        correctAttemptsRef.current = 0;
        startTimeRef.current = Date.now();
        startLevel(1);
      };

      return (
        <div className="flex flex-col justify-between min-h-[580px]">
          {/* HEADER */}
          <div className="flex items-center justify-between pb-3 border-b border-gray-100">
            <button onClick={handleBack} className="w-10 h-10 rounded-full bg-[#F4F7F5] flex items-center justify-center font-bold text-lg active:scale-95">←</button>
            <div className="text-center">
              <h2 className="text-lg font-bold text-gray-900">Color & Pattern</h2>
              <span className="text-xs text-[#527863] font-medium">Level {level} of 2</span>
            </div>
            <button onClick={() => speak(promptText)} className="w-10 h-10 rounded-full bg-[#EAF5EF] text-[#2E9E63] border border-[#BEE3CE] flex items-center justify-center text-lg active:scale-95">🔊</button>
          </div>

          {/* PROMPT */}
          <div className="my-3 p-3.5 bg-[#F8FAF9] border-2 border-[#DCE5E0] rounded-2xl text-center min-h-[68px] flex items-center justify-center">
            <p className="text-sm sm:text-base font-bold text-gray-800 leading-snug">{promptText}</p>
          </div>

          {/* 2x2 TILES */}
          <div className="grid grid-cols-2 gap-3 my-2">
            {TILE_INFO.map(t => {
              const isLit = litTile === t.id;
              return (
                <button
                  key={t.id}
                  disabled={isDemonstrating}
                  onClick={() => handleTileClick(t.id)}
                  className={`min-h-[120px] rounded-3xl border-2 flex flex-col items-center justify-center gap-2 p-3 font-bold transition-all duration-200 active:scale-95 shadow-xs ${
                    isLit ? t.litClass : t.colorClass
                  } ${isDemonstrating ? 'cursor-default' : 'cursor-pointer'}`}
                >
                  <div className="w-9 h-9 rounded-full flex items-center justify-center bg-white/40">●</div>
                  <span className="text-sm tracking-wide">{t.label}</span>
                </button>
              );
            })}
          </div>

          {/* REPLAY PATTERN */}
          <div className="text-center my-2">
            <button
              disabled={isDemonstrating}
              onClick={() => {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                runDemo(sequence);
              }}
              className="text-xs font-bold text-[#2E9E63] hover:underline inline-flex items-center gap-1.5 py-1 px-3 rounded-lg cursor-pointer"
            >
              ↻ Watch pattern again
            </button>
          </div>

          {/* RESULT SCREEN MODAL */}
          {isCompleted && (
            <div className="absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-6 text-center">
              <div className="w-16 h-16 bg-[#2E9E63] text-white rounded-full flex items-center justify-center text-2xl mb-3 shadow-md">✓</div>
              <h3 className="text-2xl font-black text-gray-900 mb-1">Wonderful focus!</h3>
              <p className="text-sm text-gray-600 mb-4">You successfully recalled the color sequence.</p>
              <div className="bg-[#F8FAF9] border border-gray-200 p-3 rounded-2xl flex justify-around w-full max-w-xs mb-4">
                <div><div className="text-xl font-black text-[#2E9E63]">{stats.accuracy}%</div><div className="text-[10px] text-gray-500 font-bold uppercase">Accuracy</div></div>
                <div className="w-px bg-gray-200"></div>
                <div><div className="text-xl font-black text-gray-800">{stats.time}s</div><div className="text-[10px] text-gray-500 font-bold uppercase">Time</div></div>
                <div className="w-px bg-gray-200"></div>
                <div><div className="text-xl font-black text-[#2E9E63]">{stats.cas}</div><div className="text-[10px] text-gray-500 font-bold uppercase">CAS Score</div></div>
              </div>
              <button onClick={playAgain} className="w-full max-w-xs h-12 bg-[#2E9E63] hover:bg-[#258552] text-white rounded-xl font-bold mb-2 cursor-pointer active:scale-95 transition-all">PLAY AGAIN</button>
              <button onClick={handleBack} className="w-full max-w-xs h-12 bg-[#F4F7F5] border border-gray-300 text-gray-800 rounded-xl font-bold cursor-pointer active:scale-95 transition-all">BACK TO GAMES</button>
            </div>
          )}
        </div>
      );
    }

    // --- GAME 2: STORY RECALL ---
    function StoryRecallGame({ onFinish, onBack }) {
      const [phase, setPhase] = useState('story');
      const [questionIndex, setQuestionIndex] = useState(0);
      const [isCompleted, setIsCompleted] = useState(false);
      const [stats, setStats] = useState({ accuracy: 100, time: 0, cas: 95 });
      const [feedback, setFeedback] = useState(null);

      const startTimeRef = useRef(Date.now());
      const attemptsRef = useRef(0);
      const correctAttemptsRef = useRef(0);
      const activeUtteranceRef = useRef(null);

      const STORY_TEXT = "Sunita walked to the local morning market in the hills. She bought fresh green tea leaves and fragrant yellow marigold flowers for her home.";

      const QUESTIONS = [
        {
          question: "What did Sunita buy at the market?",
          options: [
            { text: "Green Tea & Flowers", icon: "🍵", isCorrect: true },
            { text: "Bread & Fresh Milk", icon: "🍞", isCorrect: false },
            { text: "Red Apples & Rice", icon: "🍎", isCorrect: false }
          ],
          affirmation: "That's right! Sunita bought fresh tea and flowers."
        },
        {
          question: "Where did Sunita go this morning?",
          options: [
            { text: "The Hill Market", icon: "🏞️", isCorrect: true },
            { text: "The Train Station", icon: "🚆", isCorrect: false },
            { text: "The Health Clinic", icon: "🏥", isCorrect: false }
          ],
          affirmation: "Wonderful! Sunita walked to the morning hill market."
        }
      ];

      const speak = useCallback((text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        if (!text) return;

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 0.88;
        
        activeUtteranceRef.current = u;
        window._careLoopActiveUtterance = u;

        u.onend = () => {
          if (activeUtteranceRef.current === u) activeUtteranceRef.current = null;
        };
        u.onerror = () => {
          if (activeUtteranceRef.current === u) activeUtteranceRef.current = null;
        };

        window.speechSynthesis.speak(u);
      }, []);

      const handleBack = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (onBack) onBack();
      };

      useEffect(() => {
        startTimeRef.current = Date.now();
        const t = setTimeout(() => speak(STORY_TEXT), 400);
        return () => {
          clearTimeout(t);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [speak]);

      const handleSelectOption = (opt, qData) => {
        attemptsRef.current += 1;
        if (opt.isCorrect) {
          correctAttemptsRef.current += 1;
          setFeedback({ text: qData.affirmation, isCorrect: true });
          speak(qData.affirmation);
          setTimeout(() => {
            if (questionIndex + 1 < QUESTIONS.length) {
              const nextIdx = questionIndex + 1;
              setQuestionIndex(nextIdx);
              setFeedback(null);
              speak(QUESTIONS[nextIdx].question);
            } else {
              finish();
            }
          }, 2000);
        } else {
          const enc = "Great effort! Let's remember: Sunita went to the hill market for tea leaves and flowers.";
          setFeedback({ text: enc, isCorrect: false });
          speak(enc);
          setTimeout(() => {
            if (questionIndex + 1 < QUESTIONS.length) {
              const nextIdx = questionIndex + 1;
              setQuestionIndex(nextIdx);
              setFeedback(null);
              speak(QUESTIONS[nextIdx].question);
            } else {
              finish();
            }
          }, 2600);
        }
      };

      const finish = () => {
        const elapsed = Math.max(14, Math.round((Date.now() - startTimeRef.current) / 1000));
        const acc = attemptsRef.current > 0 ? Math.min(100, Math.round((correctAttemptsRef.current / attemptsRef.current) * 100)) : 100;
        const cas = Math.min(99, Math.round((acc * 0.70) + (Math.max(20, 100 - (elapsed * 1.1)) * 0.30)));
        const res = { accuracy: acc, time: elapsed, cas };
        setStats(res);
        setIsCompleted(true);
        if (onFinish) onFinish(res);
      };

      const playAgain = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setIsCompleted(false);
        setPhase('story');
        setQuestionIndex(0);
        setFeedback(null);
        attemptsRef.current = 0;
        correctAttemptsRef.current = 0;
        startTimeRef.current = Date.now();
        speak(STORY_TEXT);
      };

      return (
        <div className="flex flex-col justify-between min-h-[580px]">
          <div className="flex items-center justify-between pb-3 border-b border-gray-100">
            <button onClick={handleBack} className="w-10 h-10 rounded-full bg-[#F4F7F5] flex items-center justify-center font-bold text-lg active:scale-95">←</button>
            <div className="text-center">
              <h2 className="text-lg font-bold text-gray-900">Story Recall</h2>
              <span className="text-xs text-[#527863] font-medium">Auditory Attention</span>
            </div>
            <button onClick={() => speak(phase === 'story' ? STORY_TEXT : QUESTIONS[questionIndex].question)} className="w-10 h-10 rounded-full bg-[#EAF5EF] text-[#2E9E63] border border-[#BEE3CE] flex items-center justify-center text-lg active:scale-95">🔊</button>
          </div>

          {phase === 'story' && (
            <div className="my-auto space-y-3">
              <div className="bg-[#F8FAF9] border-2 border-gray-200 rounded-2xl p-4 text-center space-y-3">
                <div className="w-full h-24 bg-gradient-to-br from-[#EAF5EF] to-[#D5EDE0] rounded-xl flex items-center justify-center text-3xl gap-2">
                  <span>🌿</span><span>🌼</span><span>🏞️</span>
                </div>
                <p className="text-sm sm:text-base font-bold text-gray-800 leading-relaxed">"{STORY_TEXT}"</p>
                <button
                  onClick={() => {
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    speak(STORY_TEXT);
                  }}
                  className="w-full py-2 bg-[#EAF5EF] text-[#1E6B43] rounded-xl text-xs font-bold border border-[#B5E0CE]"
                >
                  🔊 Hear Story Again
                </button>
              </div>
              <button
                onClick={() => {
                  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                  setPhase('questions');
                  setQuestionIndex(0);
                  setFeedback(null);
                  speak(QUESTIONS[0].question);
                }}
                className="w-full h-12 bg-[#2E9E63] hover:bg-[#258552] text-white rounded-xl font-bold text-sm shadow-md active:scale-95"
              >
                READY FOR QUESTIONS →
              </button>
            </div>
          )}

          {phase === 'questions' && (
            <div className="my-auto space-y-3">
              <div className="text-xs font-bold text-gray-500 uppercase">Question {questionIndex + 1} of {QUESTIONS.length}</div>
              <div className="p-3 bg-[#F8FAF9] border-2 border-gray-200 rounded-xl text-center">
                <h3 className="text-sm sm:text-base font-bold text-gray-900">{QUESTIONS[questionIndex].question}</h3>
              </div>
              <div className="space-y-2">
                {QUESTIONS[questionIndex].options.map((opt, i) => (
                  <button
                    key={i}
                    onClick={() => handleSelectOption(opt, QUESTIONS[questionIndex])}
                    className="w-full min-h-[52px] rounded-xl p-3 bg-gray-50 hover:bg-emerald-50 border-2 border-gray-200 hover:border-emerald-500 flex items-center gap-3 text-left font-bold text-sm active:scale-95"
                  >
                    <span className="text-2xl">{opt.icon}</span>
                    <span>{opt.text}</span>
                  </button>
                ))}
              </div>
              {feedback && (
                <div className={`p-2.5 rounded-xl text-center text-xs font-bold border ${feedback.isCorrect ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'}`}>
                  {feedback.text}
                </div>
              )}
            </div>
          )}

          {isCompleted && (
            <div className="absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-6 text-center">
              <div className="w-16 h-16 bg-[#2E9E63] text-white rounded-full flex items-center justify-center text-2xl mb-3 shadow-md">✓</div>
              <h3 className="text-2xl font-black text-gray-900 mb-1">Wonderful memory!</h3>
              <p className="text-sm text-gray-600 mb-4">You remembered the story details clearly.</p>
              <div className="bg-[#F8FAF9] border border-gray-200 p-3 rounded-2xl flex justify-around w-full max-w-xs mb-4">
                <div><div className="text-xl font-black text-[#2E9E63]">{stats.accuracy}%</div><div className="text-[10px] text-gray-500 font-bold uppercase">Accuracy</div></div>
                <div className="w-px bg-gray-200"></div>
                <div><div className="text-xl font-black text-gray-800">{stats.time}s</div><div className="text-[10px] text-gray-500 font-bold uppercase">Time</div></div>
                <div className="w-px bg-gray-200"></div>
                <div><div className="text-xl font-black text-[#2E9E63]">{stats.cas}</div><div className="text-[10px] text-gray-500 font-bold uppercase">CAS Score</div></div>
              </div>
              <button onClick={playAgain} className="w-full max-w-xs h-12 bg-[#2E9E63] hover:bg-[#258552] text-white rounded-xl font-bold mb-2 active:scale-95">PLAY AGAIN</button>
              <button onClick={handleBack} className="w-full max-w-xs h-12 bg-[#F4F7F5] border border-gray-300 text-gray-800 rounded-xl font-bold active:scale-95">BACK TO GAMES</button>
            </div>
          )}
        </div>
      );
    }

    // --- GAME 3: DAILY OBJECTS ---
    function DailyObjectsGame({ onFinish, onBack }) {
      const [phase, setPhase] = useState('study');
      const [selectedItems, setSelectedItems] = useState([]);
      const [isCompleted, setIsCompleted] = useState(false);
      const [stats, setStats] = useState({ accuracy: 100, time: 0, cas: 96 });

      const startTimeRef = useRef(Date.now());
      const studyTimerRef = useRef(null);
      const activeUtteranceRef = useRef(null);

      const TARGETS = [
        { id: 'glasses', label: 'Reading Glasses', icon: '👓' },
        { id: 'cup', label: 'Brass Tea Cup', icon: '☕' },
        { id: 'keys', label: 'House Keys', icon: '🔑' }
      ];

      const RECALL_ITEMS = [
        { id: 'toothbrush', label: 'Toothbrush', icon: '🪥', isTarget: false },
        { id: 'glasses', label: 'Reading Glasses', icon: '👓', isTarget: true },
        { id: 'cup', label: 'Brass Tea Cup', icon: '☕', isTarget: true },
        { id: 'book', label: 'Story Book', icon: '📖', isTarget: false },
        { id: 'keys', label: 'House Keys', icon: '🔑', isTarget: true },
        { id: 'lantern', label: 'Brass Lantern', icon: '🪔', isTarget: false }
      ];

      const speak = useCallback((text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        if (!text) return;

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 0.88;
        
        activeUtteranceRef.current = u;
        window._careLoopActiveUtterance = u;

        u.onend = () => {
          if (activeUtteranceRef.current === u) activeUtteranceRef.current = null;
        };
        u.onerror = () => {
          if (activeUtteranceRef.current === u) activeUtteranceRef.current = null;
        };

        window.speechSynthesis.speak(u);
      }, []);

      const handleBack = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (onBack) onBack();
      };

      const startStudy = useCallback(() => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setPhase('study');
        setSelectedItems([]);
        setIsCompleted(false);
        startTimeRef.current = Date.now();
        speak("Look at these three objects on your table. Remember them.");
        if (studyTimerRef.current) clearTimeout(studyTimerRef.current);
        studyTimerRef.current = setTimeout(() => {
          startRecall();
        }, 15000);
      }, [speak]);

      const startRecall = useCallback(() => {
        if (studyTimerRef.current) clearTimeout(studyTimerRef.current);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setPhase('recall');
        speak("Which items were on the table? Tap the 3 items.");
      }, [speak]);

      useEffect(() => {
        startStudy();
        return () => {
          if (studyTimerRef.current) clearTimeout(studyTimerRef.current);
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [startStudy]);

      const toggleItem = (id) => {
        if (selectedItems.includes(id)) {
          setSelectedItems(selectedItems.filter(x => x !== id));
        } else {
          if (selectedItems.length >= 3) {
            speak("You already selected three items. Tap one to change it, or click check.");
            return;
          }
          setSelectedItems([...selectedItems, id]);
        }
      };

      const handleConfirm = () => {
        if (selectedItems.length !== 3) return;
        let c = 0;
        TARGETS.forEach(t => { if (selectedItems.includes(t.id)) c++; });
        const acc = Math.round((c / 3) * 100);
        const elapsed = Math.max(16, Math.round((Date.now() - startTimeRef.current) / 1000));
        const cas = Math.min(99, Math.round((acc * 0.70) + (Math.max(20, 100 - (elapsed * 1.1)) * 0.30)));
        
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        speak("You remembered the daily objects! Great observation.");
        
        const res = { accuracy: acc, time: elapsed, cas };
        setStats(res);
        setIsCompleted(true);
        if (onFinish) onFinish(res);
      };

      const playAgain = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        startStudy();
      };

      return (
        <div className="flex flex-col justify-between min-h-[580px]">
          <div className="flex items-center justify-between pb-3 border-b border-gray-100">
            <button onClick={handleBack} className="w-10 h-10 rounded-full bg-[#F4F7F5] flex items-center justify-center font-bold text-lg active:scale-95">←</button>
            <div className="text-center">
              <h2 className="text-lg font-bold text-gray-900">Daily Objects</h2>
              <span className="text-xs text-[#527863] font-medium">Visual Retention</span>
            </div>
            <button onClick={() => speak(phase === 'study' ? "Look at these three objects on your table. Remember them." : "Which items were on the table? Tap the 3 items.")} className="w-10 h-10 rounded-full bg-[#EAF5EF] text-[#2E9E63] border border-[#BEE3CE] flex items-center justify-center text-lg active:scale-95">🔊</button>
          </div>

          {phase === 'study' && (
            <div className="my-auto space-y-3">
              <div className="p-3 bg-[#F8FAF9] border-2 border-gray-200 rounded-xl text-center">
                <span className="text-[10px] font-bold uppercase text-[#2E9E63] tracking-wider block">Study Phase</span>
                <p className="text-sm sm:text-base font-bold text-gray-800">Look at these three objects on your table. Remember them.</p>
              </div>
              <div className="grid grid-cols-3 gap-2">
                {TARGETS.map(t => (
                  <div key={t.id} className="p-3 bg-gray-50 border-2 border-gray-200 rounded-2xl flex flex-col items-center justify-center gap-1.5 min-h-[95px]">
                    <span className="text-3xl">{t.icon}</span>
                    <span className="text-[11px] font-bold text-center leading-tight text-gray-800">{t.label}</span>
                  </div>
                ))}
              </div>
              <button onClick={startRecall} className="w-full h-12 bg-[#2E9E63] hover:bg-[#258552] text-white rounded-xl font-bold text-sm shadow-md active:scale-95">I REMEMBERED THEM ✓</button>
            </div>
          )}

          {phase === 'recall' && (
            <div className="my-auto space-y-3">
              <div className="p-3 bg-[#F8FAF9] border-2 border-gray-200 rounded-xl text-center flex items-center justify-between">
                <span className="text-[10px] font-bold uppercase text-[#2E9E63]">Tap 3 items</span>
                <span className="text-xs font-bold text-gray-500">Selected: {selectedItems.length} of 3</span>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {RECALL_ITEMS.map(item => {
                  const isSel = selectedItems.includes(item.id);
                  return (
                    <button
                      key={item.id}
                      onClick={() => toggleItem(item.id)}
                      className={`min-h-[52px] rounded-xl p-2.5 border-2 flex items-center gap-2 font-bold text-xs active:scale-95 ${isSel ? 'bg-emerald-100/70 border-emerald-600 text-emerald-950' : 'bg-gray-50 border-gray-200 text-gray-800'}`}
                    >
                      <span className="text-2xl">{item.icon}</span>
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </div>
              <button
                disabled={selectedItems.length !== 3}
                onClick={handleConfirm}
                className={`w-full h-12 rounded-xl font-bold text-sm active:scale-95 transition-all ${selectedItems.length === 3 ? 'bg-[#2E9E63] hover:bg-[#258552] text-white shadow-md cursor-pointer' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
              >
                CHECK MY CHOICES →
              </button>
            </div>
          )}

          {isCompleted && (
            <div className="absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-6 text-center">
              <div className="w-16 h-16 bg-[#2E9E63] text-white rounded-full flex items-center justify-center text-2xl mb-3 shadow-md">✓</div>
              <h3 className="text-2xl font-black text-gray-900 mb-1">Great observation!</h3>
              <p className="text-sm text-gray-600 mb-4">You remembered the daily objects from the table.</p>
              <div className="bg-[#F8FAF9] border border-gray-200 p-3 rounded-2xl flex justify-around w-full max-w-xs mb-4">
                <div><div className="text-xl font-black text-[#2E9E63]">{stats.accuracy}%</div><div className="text-[10px] text-gray-500 font-bold uppercase">Accuracy</div></div>
                <div className="w-px bg-gray-200"></div>
                <div><div className="text-xl font-black text-gray-800">{stats.time}s</div><div className="text-[10px] text-gray-500 font-bold uppercase">Time</div></div>
                <div className="w-px bg-gray-200"></div>
                <div><div className="text-xl font-black text-[#2E9E63]">{stats.cas}</div><div className="text-[10px] text-gray-500 font-bold uppercase">CAS Score</div></div>
              </div>
              <button onClick={playAgain} className="w-full max-w-xs h-12 bg-[#2E9E63] hover:bg-[#258552] text-white rounded-xl font-bold mb-2 active:scale-95">PLAY AGAIN</button>
              <button onClick={handleBack} className="w-full max-w-xs h-12 bg-[#F4F7F5] border border-gray-300 text-gray-800 rounded-xl font-bold active:scale-95">BACK TO GAMES</button>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN HUB DEMO WRAPPER ---
    function GamesDemoHub() {
      const [activeGame, setActiveGame] = useState(null);

      const gamesList = [
        { id: 'color', title: 'Color & Pattern Recall', category: 'Spatial & Sequence Memory', icon: '🎨', comp: ColorPatternGame },
        { id: 'story', title: 'Story Recall', category: 'Auditory Attention & Narrative', icon: '📖', comp: StoryRecallGame },
        { id: 'objects', title: 'Daily Objects', category: 'Short-Term Visual Retention', icon: '👓', comp: DailyObjectsGame }
      ];

      const handleSwitchGame = (gameId) => {
        // ALWAYS silence ongoing speech before switching games
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setActiveGame(gameId);
      };

      const handleFinish = (result) => {
        if (window.careLoopApi) {
          window.careLoopApi.recordGame({
            gameType: activeGame,
            gameTitle: activeGame,
            accuracy: result.accuracy,
            durationSec: result.time,
            moves: 3
          });
        }
      };

      return (
        <div className="flex flex-col h-full relative">
          {activeGame ? (
            (() => {
              const SelectedGame = gamesList.find(g => g.id === activeGame)?.comp;
              return <SelectedGame onFinish={handleFinish} onBack={() => handleSwitchGame(null)} />;
            })()
          ) : (
            <div className="space-y-3 pt-1">
              <div className="flex items-center justify-between pb-3 border-b border-gray-100">
                <div>
                  <h1 className="text-lg font-black tracking-tight text-gray-900">Cognitive Stimulation Games</h1>
                  <p className="text-xs text-gray-500">Elderly Accessible React Suite</p>
                </div>
                <a href="/index.html" className="text-xs font-bold text-teal-700 hover:underline">CareLoop →</a>
              </div>

              <div className="space-y-2.5">
                {gamesList.map(g => (
                  <div key={g.id} className="p-3.5 bg-gray-50 hover:bg-teal-50/50 border-2 border-gray-200 hover:border-teal-500 rounded-2xl flex items-center justify-between transition-all">
                    <div className="flex items-center gap-2.5">
                      <span className="text-2xl">{g.icon}</span>
                      <div>
                        <h3 className="font-bold text-xs sm:text-sm text-gray-900">{g.title}</h3>
                        <p className="text-[11px] text-gray-500">{g.category}</p>
                      </div>
                    </div>
                    <button
                      onClick={() => handleSwitchGame(g.id)}
                      className="px-3.5 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold shadow-xs active:scale-95 transition-all cursor-pointer"
                    >
                      Play
                    </button>
                  </div>
                ))}
              </div>

              <div className="p-3 bg-emerald-50/70 border border-emerald-200 rounded-2xl text-xs text-emerald-900">
                <span className="font-bold block mb-0.5">Accessibility & Tone Safeguards:</span>
                • Rate locked to 0.88 with speech cancellation on navigation.<br/>
                • Chromium GC retention prevents mid-sentence audio cutoff.<br/>
                • Non-punitive feedback with zero failure shame.
              </div>
            </div>
          )}

          {/* Bottom Navigation Tabs */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-sm border-t border-slate-200 h-16 flex items-center justify-around px-2">
            <button
              onClick={() => handleSwitchGame(null)}
              className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg ${activeGame === null ? 'text-[#2E9E63] font-bold' : 'text-slate-500'}`}
            >
              <span className="material-symbols-outlined text-[20px]">grid_view</span>
              <span className="text-[10px]">Hub</span>
            </button>
            <button
              onClick={() => handleSwitchGame('color')}
              className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg ${activeGame === 'color' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'}`}
            >
              <span className="material-symbols-outlined text-[20px]">palette</span>
              <span className="text-[10px]">Pattern</span>
            </button>
            <button
              onClick={() => handleSwitchGame('story')}
              className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg ${activeGame === 'story' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'}`}
            >
              <span className="material-symbols-outlined text-[20px]">menu_book</span>
              <span className="text-[10px]">Story</span>
            </button>
            <button
              onClick={() => handleSwitchGame('objects')}
              className={`flex flex-col items-center gap-0.5 py-1 px-2 rounded-lg ${activeGame === 'objects' ? 'text-[#2E9E63] font-bold' : 'text-slate-500'}`}
            >
              <span className="material-symbols-outlined text-[20px]">visibility</span>
              <span className="text-[10px]">Objects</span>
            </button>
            <!-- Phone Home Indicator Bar -->
            <div className="w-28 h-1 bg-slate-300 rounded-full mx-auto absolute bottom-1.5 left-1/2 -translate-x-1/2 pointer-events-none"></div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GamesDemoHub />);
  </script>
</body>
</html>
